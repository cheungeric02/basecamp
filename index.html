  /* ================= LIVE WEATHER ================= */
  const geoCache = {}; let liveWxCache = null; let liveWxKey = "";
  function wmoInfo(code) {
    const c = Number(code);
    const table = [
      [[0,1], "Clear sky", "sun"], [[2], "Partly cloudy", "partly"], [[3], "Overcast", "cloud"],
      [[45,48], "Fog", "fog"], [[51,53,55,56,57], "Drizzle", "rain"], [[61,63,65,66,67,80,81,82], "Rain", "rain"],
      [[71,73,75,77,85,86], "Snow", "snow"], [[95,96,99], "Thunderstorm", "storm"]
    ];
    for (let i=0;i<table.length;i++) if (table[i][0].indexOf(c)>=0) return { label: table[i][1], icon: table[i][2] };
    return { label: "—", icon: "cloud" };
  }
  // Map a free-text condition (manual forecast) to an animated-icon kind.
  function condIcon(text) {
    const c = (text||"").toLowerCase();
    if (/thunder|storm|lightning/.test(c)) return "storm";
    if (/snow|flurr|sleet|blizzard/.test(c)) return "snow";
    if (/rain|drizzle|shower/.test(c)) return "rain";
    if (/fog|mist|haze/.test(c)) return "fog";
    if (/partly|part |partial|few cloud|mostly sun|mostly clear/.test(c)) return "partly";
    if (/cloud|overcast/.test(c)) return "cloud";
    if (/clear|sun|fair/.test(c)) return "sun";
    return "cloud";
  }
  // Self-contained animated weather icon (CSS drives the motion; see the wx-anim styles).
  function wxIcon(kind, size, mono) {
    size = size || 48;
    let SUN="#FBBF24", CLOUD="#9AA7B6", CLOUDD="#7E8B9A", RAIN="#38BDF8", SNOW="#CDE9FB", BOLT="#FBBF24", MOON="#E7C766";
    if (mono) { SUN=CLOUD=CLOUDD=RAIN=SNOW=BOLT=MOON="currentColor"; }
    function rayGroup(cx,cy,r1,r2){ let p='<g class="wxa-rays">'; for(let i=0;i<8;i++){ const a=i*Math.PI/4; p+='<line x1="'+(cx+Math.cos(a)*r1).toFixed(1)+'" y1="'+(cy+Math.sin(a)*r1).toFixed(1)+'" x2="'+(cx+Math.cos(a)*r2).toFixed(1)+'" y2="'+(cy+Math.sin(a)*r2).toFixed(1)+'" stroke="'+SUN+'" stroke-width="3.2" stroke-linecap="round"/>'; } return p+'</g>'; }
    function cloud(cx,cy,scale,fill){ return '<g transform="translate('+cx+' '+cy+') scale('+(scale||1)+')"><g class="wxa-cloud">' +
      '<circle cx="-8" cy="2" r="9" fill="'+fill+'"/><circle cx="6" cy="-2" r="12" fill="'+fill+'"/>' +
      '<circle cx="14" cy="4" r="8" fill="'+fill+'"/><rect x="-16" y="4" width="34" height="12" rx="6" fill="'+fill+'"/>' +
      '</g></g>'; }
    function drop(x,y,cls){ return '<line class="'+cls+'" x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y+6)+'" stroke="'+RAIN+'" stroke-width="3.2" stroke-linecap="round"/>'; }
    function flake(x,y,cls){ return '<circle class="'+cls+'" cx="'+x+'" cy="'+y+'" r="2.5" fill="'+SNOW+'"/>'; }
    let inner="";
    if (kind==="sun") inner = rayGroup(32,32,15,22) + '<circle class="wxa-sun" cx="32" cy="32" r="11" fill="'+SUN+'"/>';
    else if (kind==="moon") inner = '<g class="wxa-sun"><path d="M42 36a15 15 0 1 1-16-20 12 12 0 0 0 16 20Z" fill="'+MOON+'"/></g><circle class="wxa-twinkle" cx="46" cy="20" r="1.8" fill="'+MOON+'"/><circle class="wxa-twinkle2" cx="50" cy="29" r="1.3" fill="'+MOON+'"/>';
    else if (kind==="partly") inner = rayGroup(23,23,10,15) + '<circle class="wxa-sun" cx="23" cy="23" r="8" fill="'+SUN+'"/>' + cloud(34,38,0.92,CLOUD);
    else if (kind==="cloud") inner = cloud(20,26,0.7,CLOUDD) + cloud(32,34,1.05,CLOUD);
    else if (kind==="rain") inner = cloud(32,26,1,CLOUD) + drop(24,45,"wxa-drop") + drop(32,45,"wxa-drop2") + drop(40,45,"wxa-drop3");
    else if (kind==="snow") inner = cloud(32,26,1,CLOUD) + flake(24,47,"wxa-flake") + flake(32,45,"wxa-flake2") + flake(40,47,"wxa-flake3");
    else if (kind==="storm") inner = cloud(32,25,1,CLOUDD) + '<path class="wxa-bolt" d="M34 39l-8 11h6l-2 8 9-13h-6l3-6z" fill="'+BOLT+'"/>' + drop(22,45,"wxa-drop") + drop(43,45,"wxa-drop3");
    else if (kind==="fog") inner = cloud(32,22,0.85,CLOUD) + '<g stroke="'+CLOUD+'" stroke-width="3.4" stroke-linecap="round"><line class="wxa-fog" x1="18" y1="42" x2="46" y2="42"/><line class="wxa-fog2" x1="16" y1="49" x2="44" y2="49"/><line class="wxa-fog3" x1="20" y1="56" x2="42" y2="56"/></g>';
    else inner = cloud(32,34,1.05,CLOUD);
    return '<span class="wx-ic" style="width:'+size+'px;height:'+size+'px"><svg viewBox="0 0 64 64" width="'+size+'" height="'+size+'">'+inner+'</svg></span>';
  }
  // Icon + temps + condition row for a daily forecast card.
  function wxBody(kind, hi, lo, cond) {
    return '<div style="display:flex;align-items:center;gap:12px">' + wxIcon(kind, 46) +
      '<div style="min-width:0"><div class="temps" style="margin:0"><span class="hi">'+hi+'°</span><span class="lo"> / '+lo+'°</span></div>' +
      '<div class="cond" style="margin-top:2px">'+cond+'</div></div></div>';
  }
  // Full-box weather "scene": gradient background + auto-contrast ink per condition.
  function wxScene(kind) {
    const S = {
      sun:    { grad:"linear-gradient(160deg,#38a0e8,#83c6f2 78%)", ink:"#0a2a45" },
      moon:   { grad:"linear-gradient(160deg,#151f39,#34456c)",     ink:"#eaf0ff" },
      partly: { grad:"linear-gradient(160deg,#57a8df,#adc7d9)",     ink:"#0a2237" },

  function wxRainLines(n) { let s=""; for (let i=0;i<n;i++){ const l=(4+i*(92/n)+(i%2?3:0)).toFixed(0); const d=(0.7+(i%4)*0.16).toFixed(2); const del=((i*0.13)%1.1).toFixed(2); s+='<i class="wx-rl" style="left:'+l+'%;animation-duration:'+d+'s;animation-delay:'+del+'s"></i>'; } return s; }

  async function geocode(name) {
    if (!name) return null;

    if (name.indexOf(",") >= 0) candidates.push(name.split(",")[0].trim());
    const words = name.replace(/,/g, " ").split(/\s+/).filter(Boolean);
    if (words.length > 3) candidates.push(words.slice(0, 3).join(" "));
    if (words.length > 2) candidates.push(words.slice(0, 2).join(" "));
    for (let i = 0; i < candidates.length; i++) {
      try {
        const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name=" + encodeURIComponent(candidates[i]));
        const j = await r.json();
        if (j.results && j.results.length) { const g = { lat: j.results[0].latitude, lon: j.results[0].longitude, place: j.results[0].name }; geoCache[name] = g; return g; }
      } catch (e) {}

  }

  function packWxNudges(trip, days, daily) {
    const out = [];
    let minLow = Infinity, maxHigh = -Infinity, rainDays = [], stormDays = [], gotData = false, live = false;
    if (daily && daily.time && daily.time.length) {
      daily.time.forEach((d, i) => {
        if (days.indexOf(d) < 0) return; // only the trip's own days
        gotData = true; live = true;
        const hi = daily.temperature_2m_max ? daily.temperature_2m_max[i] : null;
        const lo = daily.temperature_2m_min ? daily.temperature_2m_min[i] : null;
        const pp = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : null;
        const code = daily.weather_code ? daily.weather_code[i] : null;
        if (lo != null && lo < minLow) minLow = lo;
        if (hi != null && hi > maxHigh) maxHigh = hi;
        const info = code != null ? wmoInfo(code) : null;
        if (info && info.icon === "storm") stormDays.push(d);

      });

        else if (c.indexOf("rain")>=0 || c.indexOf("snow")>=0 || c.indexOf("drizzle")>=0) rainDays.push(w.date);
      });
    }
    if (!gotData) return out;
    const dl = arr => arr.map(d=>fmtDate(d,"dow")).join(", ");
    if (stormDays.length) out.push({ tone:"danger", title:"Thunderstorms possible ("+dl(stormDays)+")", tip:"Sturdy tarp, extra guy-lines & stakes, rain jackets, dry bags for electronics — and a bad-weather plan." });
    if (rainDays.length) out.push({ tone:"info", title:"Rain likely ("+dl(rainDays)+")", tip:"Tarp, rain jackets, dry bags, quick-dry clothes and a bag liner for wet gear." });
    if (minLow !== Infinity && minLow <= 10) out.push({ tone:"info", title:"Cold nights — down to "+Math.round(minLow)+"°", tip:"Warm layers, a beanie, extra socks and a warmer sleeping bag or liner." });

  /* ================= TRACKER TAB ================= */
  function fmtWhen(ts) {
    if (!ts) return "";
    const d = new Date(ts); const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff/60) + " min ago";
    if (diff < 86400) return Math.floor(diff/3600) + " hr ago";
    const hh = String(d.getHours()).padStart(2,"0"), mm = String(d.getMinutes()).padStart(2,"0");
    return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + hh + ":" + mm;
  }
  function tripActivity(trip) {
    return activityCache.filter(a => a.tripId ? (a.tripId === trip.id) : (a.trip === trip.name));
  }
  function secTracker(trip) {
    let html = pageHead("Activity Tracker", "Who changed what on “"+esc(trip.name)+"” — visible only to you (admin), on this device.",
      '<button class="btn" data-action="lock-admin">Lock admin</button><button class="btn danger" data-action="clear-log">Clear log</button>');
    if (!(window.BCsync && window.BCsync.ready)) return html + emptyState(I.tracker, "Activity tracking needs live sync (the shared database).");
    startActivityWatch();
    const entries = tripActivity(trip);
    if (!entries.length) return html + emptyState(I.tracker, "No activity yet for this trip. Edits by you and your group will show up here.");

    // Contribution breakdown — how many edits each person has made, and their
    // share of the total. "joined the trip" isn't an edit, so it's excluded.
    const people = trip.people || [];
    const editEntries = entries.filter(a => (a.text || "") !== "joined the trip");
    const counts = {};
    editEntries.forEach(a => { const w = (a.who || "").trim() || "Someone"; counts[w] = (counts[w] || 0) + 1; });
    const rows = Object.keys(counts).map(w => ({ who: w, n: counts[w] })).sort((a, b) => b.n - a.n || a.who.localeCompare(b.who));
    const total = editEntries.length;
    const zero = people.filter(p => !counts[p.name]);
    if (total > 0) {
      let sum = '<div class="card card-pad section-block">' +
        '<div class="label">Contributions</div>' +
        '<div class="sub" style="margin-top:2px">' + total + ' edit' + (total === 1 ? '' : 's') + ' from ' + rows.length + ' ' + (rows.length === 1 ? 'person' : 'people') + '</div>' +
        '<div class="contrib-list">';
      rows.forEach(r => {
        const share = Math.round(r.n / total * 100);
        sum += '<div class="contrib-row">' + avatarByName(trip, r.who) +
          '<div class="contrib-bar-wrap">' +
            '<div class="contrib-row-top"><span class="contrib-who">' + esc(r.who) + '</span>' +
            '<span class="contrib-count"><b>' + r.n + '</b> edit' + (r.n === 1 ? '' : 's') + ' · ' + share + '%</span></div>' +
            '<div class="progress"><span style="width:' + share + '%"></span></div>' +
          '</div></div>';
      });
      sum += '</div>';
      if (zero.length) sum += '<div class="sub" style="margin-top:14px">No edits yet: ' + esc(zero.map(p => p.name).join(", ")) + '</div>';
      sum += '</div>';
      html += sum;
    }

    html += '<div class="section-title" style="margin-top:18px"><h3>Recent activity</h3></div>';
    html += '<div class="card"><div class="list card-pad" style="padding-top:4px;padding-bottom:4px">';
    entries.forEach(a => {
      html += '<div class="row-item">'+avatarByName(trip, a.who||"?") +
        '<div class="row-main"><div class="row-title" style="font-weight:400"><b>'+esc(a.who||"Someone")+'</b> '+esc(a.text||"")+'</div>' +
        '<div class="row-sub">'+esc(fmtWhen(a.ts))+'</div></div></div>';
    });
    html += '</div></div>';
    return html;
  }

  /* ================= TRIP LOCK (per-trip password, remembered per device) ================= */
  function unlockedSet() { try { return new Set(JSON.parse(localStorage.getItem("bc.unlocked") || "[]")); } catch (e) { return new Set(); } }
  function saveUnlocked(s) { try { localStorage.setItem("bc.unlocked", JSON.stringify(Array.from(s))); } catch (e) {} }
  function isTripUnlocked(t) { if (!t || !t.lockHash) return true; return unlockedSet().has(t.id); }
  function unlockTrip(id) { const s = unlockedSet(); s.add(id); saveUnlocked(s); }
  function lockScreen(trip) {
    return '<div class="card card-pad empty" style="max-width:460px;margin:36px auto">'+I.lock+
      '<h3 style="font-family:var(--font-display);font-size:1.3rem;margin:8px 0 4px">This trip is locked</h3>' +
      '<p>Enter the trip password to view it. You\'ll only need to do this once on this device.</p>' +
      '<button class="btn primary" data-action="unlock-current" style="margin:0 auto">Enter password</button></div>';
  }
  function promptTripPassword(t) {
    openForm({ title: "Enter trip password", submitLabel: "Unlock",
      fields: [{ key:"pw", label:"This trip is password-protected", type:"password", required:true }],
      onSubmit: async v => { try { const h = await sha256hex(v.pw); if (h === t.lockHash) { unlockTrip(t.id); state.activeId = t.id; liveWxCache = null; saveLocal(); ui.section = "overview"; render(); toast("Unlocked"); } else { toast("Incorrect password"); promptTripPassword(t); } } catch (e) { toast("Something went wrong"); } }
    });
  }
  function openTripLockManager(t) {
    if (t.lockHash) {
      openForm({ title: "Trip password", submitLabel: "Save",
        fields: [
          { key:"pw", label:"New password", type:"password", placeholder:"Leave blank to keep the current one" },
          { key:"remove", label:"Remove lock", type:"checkbox", checkLabel:"Remove the password (make this trip open to everyone)" }
        ],
        onSubmit: async v => { if (v.remove) { delete t.lockHash; save(); render(); toast("Lock removed — trip is open"); return; } if (v.pw) { const h = await sha256hex(v.pw); t.lockHash = h; unlockTrip(t.id); save(); render(); toast("Password updated"); } else { toast("No changes made"); } }
      });
    } else {
      openForm({ title: "Lock this trip", submitLabel: "Lock trip",
        fields: [{ key:"pw", label:"Set a password to view this trip", type:"password", required:true, hint:"People enter this once per device to see this trip — they won't be asked again on that device." }],
        onSubmit: async v => { const h = await sha256hex(v.pw); t.lockHash = h; unlockTrip(t.id); save(); render(); toast("Trip locked"); }
      });
    }
  }

  /* ---------- Trip management ---------- */
  const tripFields = [
    { key:"name", label:"Trip name", type:"text", required:true, placeholder:"e.g. Cottage Weekend" },
    { key:"location", label:"Location", type:"text", placeholder:"Park / town / region", hint:"Used to auto-find live weather." },
    { key:"site", label:"Site / address detail", type:"text", placeholder:"e.g. Campground — Site 12" },
    { key:"parkPhone", label:"Park office phone", type:"text", placeholder:"e.g. 613-336-2228", hint:"Shown on the Info tab so anyone can call the park." },
    { key:"startDate", label:"Start date", type:"date", row:true },
    { key:"endDate", label:"End date", type:"date" },
    { key:"checkin", label:"Check-in time", type:"text", placeholder:"e.g. 2:00 PM", row:true },
    { key:"checkout", label:"Check-out time", type:"text", placeholder:"e.g. 2:00 PM" },
    { key:"lat", label:"Latitude (optional)", type:"number", placeholder:"e.g. 44.90", row:true },
    { key:"lon", label:"Longitude (optional)", type:"number", placeholder:"e.g. -77.21" },
  ];
  function newTrip() {
    openForm({ title:"New trip", submitLabel:"Create trip", fields: tripFields, values:{}, onSubmit: v => {
      const t = blankTrip(v.name); t.location=v.location; t.site=v.site; t.parkPhone=v.parkPhone; t.startDate=v.startDate; t.endDate=v.endDate; t.checkin=v.checkin; t.checkout=v.checkout; t.lat=v.lat; t.lon=v.lon;
      state.trips.push(t); state.activeId = t.id; ui.section = "overview"; save(); logActivity("created trip “"+v.name+"”"); render();
      toast("Trip created — add your crew in Guests");
    }});
  }
  function editTrip() {
    const t = activeTrip();
    const fields = tripFields.concat([]);
    openForm({ title:"Trip details", fields: fields, values: t, onSubmit: v => {
      Object.assign(t, { name:v.name, location:v.location, site:v.site, parkPhone:v.parkPhone, startDate:v.startDate, endDate:v.endDate, checkin:v.checkin, checkout:v.checkout, lat:v.lat, lon:v.lon });
      liveWxCache = null; save(); logActivity("updated the trip details"); render(); toast("Trip updated");
    }, extraFooter: true });
    // add a delete-trip control into the modal footer
    if (state.trips.length > 1) {
      const foot = document.querySelector("#overlay .modal-foot");
      if (foot) { const b = document.createElement("button"); b.type="button"; b.className="btn danger"; b.style.marginRight="auto";
        b.textContent = "Delete trip"; b.addEventListener("click", () => { closeModal(); confirmDialog("Delete "+t.name+"?", "This permanently removes the trip and all its data for everyone.", () => { const delId = t.id; logActivity("deleted trip “"+t.name+"”"); state.trips = state.trips.filter(x=>x.id!==delId); state.activeId = state.trips[0].id; ui.section="overview"; saveLocal(); if (window.BCsync && window.BCsync.ready) window.BCsync.removeTrip(delId); render(); toast("Trip deleted"); }); });
        foot.insertBefore(b, foot.firstChild); }
    }
    // add a lock / password control into the modal footer
    (function () {
      const foot = document.querySelector("#overlay .modal-foot");
      if (foot) {
        const lb = document.createElement("button"); lb.type = "button"; lb.className = "btn"; lb.style.marginRight = "8px";
        lb.innerHTML = I.lock + (t.lockHash ? " Password" : " Lock trip");
        lb.addEventListener("click", () => { closeModal(); openTripLockManager(t); });
        foot.insertBefore(lb, foot.firstChild);
      }
    })();
  }

  /* ---------- Export / Import ---------- */
  async function doExport() {
    const data = JSON.stringify(state, null, 2);
    const fname = "basecamp-trips-" + todayISO() + ".json";
    if (window.claude && window.claude.downloads && typeof window.claude.downloads.save === "function") {
      try { await window.claude.downloads.save({ filename: fname, data }); toast("Backup saved"); return; }
      catch (e) { if (e && e.code === "user_rejected") { toast("Export cancelled"); return; } /* fall through */ }
    }
    // fallback: data-uri download
    try {
      const a = document.createElement("a");
      a.href = "data:application/json;charset=utf-8," + encodeURIComponent(data);
      a.download = fname; document.body.appendChild(a); a.click(); a.remove();
      toast("Backup downloaded");
    } catch (e) { toast("Export not available here"); }
  }
  function doImport() {
    if (!isAdmin()) { toast("Only the admin can restore a backup"); return; }
    confirmDialog("Restore a backup?", "⚠ This replaces ALL current trips with the ones from the backup file — for everyone in your group, not just you. It can't be undone. Are you sure you want to continue?", () => {
      const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json,.json";
      inp.addEventListener("change", () => {
        const file = inp.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (!data || !Array.isArray(data.trips)) throw new Error("bad");
            state = data;
            if (state.theme !== "light" && state.theme !== "dark") state.theme = "light";
            if (!state.activeId || !state.trips.find(t=>t.id===state.activeId)) state.activeId = state.trips[0].id;
            state.trips.forEach(t => ensureShape(t));
            ui.section = "overview"; applyTheme(); saveLocal(); if (window.BCsync && window.BCsync.ready) window.BCsync.writeAll(state.trips); render();
            toast("Backup restored (" + data.trips.length + " trip" + (data.trips.length===1?"":"s") + ")");
          } catch (e) { toast("Couldn't read that file — is it a Basecamp backup?"); }
        };
        reader.readAsText(file);
      });
      inp.click();
    }, "Yes, continue");
  }

  /* ---------- Global event handling ---------- */
  // Track where the mouse press began so a drag that STARTS inside the dialog
  // (e.g. selecting text in a field) and ends on the backdrop doesn't close it.
  let pressStartedOnBackdrop = false;
  document.addEventListener("mousedown", e => { pressStartedOnBackdrop = (e.target.id === "overlay"); }, true);
  document.addEventListener("click", e => {
    const closeBtn = e.target.closest("[data-close]");
    if (closeBtn) { closeModal(); return; }
    if (e.target.id === "overlay") { if (pressStartedOnBackdrop) closeModal(); return; }
    const actEl = e.target.closest("[data-action]");
    if (!actEl) return;
    // checkboxes and selects are handled on 'change', not click
    if (actEl.matches('input[type="checkbox"]') || actEl.tagName === "SELECT") return;
    const fn = ACTIONS[actEl.dataset.action];
    if (fn) { e.preventDefault(); fn(actEl); }
  });
  document.addEventListener("change", e => {
    const actEl = e.target.closest("[data-action]");
    if (!actEl) return;
    if (actEl.tagName === "SELECT") { const fn = ACTIONS[actEl.dataset.action]; if (fn) fn(actEl); return; }
    if (actEl.matches('input[type="checkbox"]')) { const fn = ACTIONS[actEl.dataset.action]; if (fn) fn(actEl); return; }
    if (actEl.matches('input.store-input')) { const fn = ACTIONS[actEl.dataset.action]; if (fn) fn(actEl); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("overlay").classList.contains("open")) closeModal(); });

  /* ---------- Collaboration hooks (used by the Firebase module below) ---------- */
  function foodOrDrink(name) {
    return /(water|juice|soda|\bpop\b|cola|beer|wine|coffee|tea|lemonade|gatorade|cider|cocktail|vodka|whisk|\brum\b|seltzer|sparkling|\bmilk\b|drink|\bale\b|smoothie)/i.test(name || "") ? "Drinks" : "Food";
  }
  function ensureShape(t) {
    ["weather","meals","shopping","roles","schedule","packing","guests","budget","checklist","people"].forEach(k => { if (!Array.isArray(t[k])) t[k] = []; });
    if (typeof t.notes !== "string") t.notes = "";
    if (!t.personalPacking || typeof t.personalPacking !== "object" || Array.isArray(t.personalPacking)) t.personalPacking = {};
    (t.packing || []).forEach(p => { if (!Array.isArray(p.personIds)) p.personIds = p.personId ? [p.personId] : []; });
    (t.shopping || []).forEach(s => { if (!Array.isArray(s.assignedIds)) s.assignedIds = []; if (typeof s.store !== "string") s.store = ""; if (s.category === "Food & Drink") s.category = foodOrDrink(s.item); });
    (t.schedule || []).forEach(s => { if (!s.type) s.type = schedTypeGuess(s.activity); });
    ensureReceipts(t);
  }
  // Receipts are first-class objects that many purchases can point at via receiptId.
  // Older expenses stored the photo inline on e.receipt — fold those into a receipt object.
  function ensureReceipts(t) {
    if (!Array.isArray(t.receipts)) t.receipts = [];
    (t.budget || []).forEach(e => {
      if (e.receipt && !e.receiptId) {
        const r = { id: uid(), photo: e.receipt, store: e.description || "", ts: Date.now() };
        t.receipts.push(r); e.receiptId = r.id;
      }
      if ("receipt" in e) delete e.receipt;
    });
  }
  function schedTypeGuess(activity) {
    const a = (activity||"").toLowerCase();
    if (/check ?in|check ?out|arriv|depart|drive|driving|\bleave\b|pack up|head (home|back)|road|carpool/.test(a)) return "Travel";
    if (/breakfast|lunch|dinner|bbq|s'?mores|snack|brunch|coffee|\bmeal\b|cook/.test(a)) return "Meal";
    if (/set ?up|setup|pitch|tear ?down|take down/.test(a)) return "Setup";
    if (/relax|free time|chill|\bnap\b|hang out|stargaz|campfire/.test(a)) return "Free time";
    return "Activity";
  }
  function isEditing() {
    const ov = document.getElementById("overlay");
    if (ov && ov.classList.contains("open")) return true;
    const a = document.activeElement;
    return !!(a && (a.id === "tripNotes" || a.id === "newCheck"));
  }
  // Merge a remote array into the local one by id, reusing the existing local object for each
  // matching id (so references held by open editors stay valid). Returns an array of live objects
  // in the remote order; ids only present remotely are added, ids gone remotely are dropped.
  function mergeById(localArr, remoteArr) {
    if (!Array.isArray(remoteArr)) return remoteArr;
    const local = Array.isArray(localArr) ? localArr : [];
    const lb = {}; local.forEach(x => { if (x && x.id != null) lb[x.id] = x; });
    return remoteArr.map(r => {
      if (r && r.id != null && lb[r.id]) {
        const o = lb[r.id];
        Object.keys(o).forEach(k => { if (!(k in r)) delete o[k]; }); // drop keys removed remotely
        Object.assign(o, r);
        return o;
      }
      return r;
    });
  }
  window.__bcApp = {
    getLocalTrips() { return state.trips; },
    refresh() { render(); },
    syncError() { toast("Sync issue — check the database rules in Firebase"); },
    applyRemote(remoteTrips) {
      if (!Array.isArray(remoteTrips) || !remoteTrips.length) return;
      const byId = {};
      remoteTrips.forEach(t => { ensureShape(t); byId[t.id] = t; });
      // update existing trips in place (preserves object refs held by open editors), add new ones.
      // Nested item arrays are merged by id so refs an open editor holds (e.g. a shopping item
      // being priced) stay live — otherwise the editor would write to a detached, replaced object.
      const NESTED = ["people","weather","meals","shopping","roles","schedule","packing","guests","budget","checklist","todos","receipts"];
      remoteTrips.forEach(rt => {
        const lt = state.trips.find(t => t.id === rt.id);
        if (lt) { NESTED.forEach(k => { if (Array.isArray(rt[k])) rt[k] = mergeById(lt[k], rt[k]); }); Object.assign(lt, rt); }
        else state.trips.push(rt);
      });
      // drop any local trips that no longer exist remotely (remote is the source of truth)
      state.trips = state.trips.filter(t => byId[t.id]);
      if (!state.trips.find(t => t.id === state.activeId)) state.activeId = (state.trips[0] || {}).id;
      saveLocal();
      if (!isEditing()) render();
    }
  };

  init();
})();
</script>

  /* ⬇⬇⬇  PASTE YOUR FIREBASE CONFIG BETWEEN THE BRACES  ⬇⬇⬇ */
  const firebaseConfig = {

  const notConfigured = JSON.stringify(firebaseConfig).includes("PASTE_HERE");
  if (notConfigured) {
    console.info("[Basecamp] Firebase not set up yet — running in local-only mode.");
  } else {
    try {
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const tripsRef = ref(db, "trips");
      window.BCsync = {
        ready: true,
        writeTrip(id, trip) { set(ref(db, "trips/" + id), JSON.stringify(trip)).catch(e => console.warn("write failed", e)); },
        writeAll(trips) { const o = {}; trips.forEach(t => { o[t.id] = JSON.stringify(t); }); set(tripsRef, o).catch(e => console.warn("writeAll failed", e)); },
        removeTrip(id) { remove(ref(db, "trips/" + id)).catch(e => console.warn("remove failed", e)); },
        logActivity(entry) { try { push(ref(db, "activity"), entry); } catch (e) { console.warn("log failed", e); } },
        watchActivity(cb) { try { onValue(query(ref(db, "activity"), limitToLast(300)), s => cb(s.val())); } catch (e) { console.warn("watch failed", e); } },
        getAdminHash() { return get(ref(db, "admin/passHash")).then(s => s.exists() ? s.val() : null).catch(() => null); },
        setAdminHash(h) { return set(ref(db, "admin/passHash"), h); },
        clearActivity() { return remove(ref(db, "activity")); },
        removeActivityKeys(keys) { try { (keys || []).forEach(k => remove(ref(db, "activity/" + k))); } catch (e) { console.warn("removeKeys failed", e); } }
      };
      if (window.__bcApp) window.__bcApp.refresh(); // reflect "Live sync on"
      let seeded = false;
      onValue(tripsRef, snap => {
        const val = snap.val();
        if (!val) {
          // First person to connect seeds the shared database from their local copy.
          if (!seeded && window.__bcApp) {
            seeded = true;
            const local = window.__bcApp.getLocalTrips();
            if (local && local.length) window.BCsync.writeAll(local);
          }
          return;
        }
        const trips = Object.keys(val).map(k => { try { return JSON.parse(val[k]); } catch (e) { return null; } }).filter(Boolean);
        if (window.__bcApp) window.__bcApp.applyRemote(trips);
      }, err => {
        console.warn("[Basecamp] Database read error:", err);
        if (window.__bcApp) window.__bcApp.syncError(err);
      });
    } catch (e) {
      console.error("[Basecamp] Firebase init failed:", e);
    }
  }
</script>
