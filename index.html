  /* =========================================================
     SECTIONS
  ========================================================= */
  // A little "trail to camp" scene for the countdown tile. The hiker marker
  // sits farther along the path as the trip nears; the campfire lights up in
  // the final stretch. Ember-toned parts use currentColor (set on .cd-trail).
  function trailScene(du, dueEnd) {
    const inProgress = (du !== null && du <= 0 && dueEnd >= 0);
    let p, lit, showFlag;
    if (du === null) { p = 0.05; lit = false; showFlag = false; }
    else if (du > 0) { p = Math.max(0.05, Math.min(0.82, (30 - du) / 30)); lit = du <= 3; showFlag = true; }
    else if (inProgress) { p = 0.92; lit = true; showFlag = false; }
    else { p = 0.92; lit = false; showFlag = false; }

    const P0 = [16, 142], C = [120, 108], P2 = [196, 130];
    const q = t => { const m = 1 - t; return [m*m*P0[0] + 2*m*t*C[0] + t*t*P2[0], m*m*P0[1] + 2*m*t*C[1] + t*t*P2[1]]; };
    const mk = q(p), mx = mk[0].toFixed(1), my = mk[1].toFixed(1);

    const tree = (x, by, sc) => {
      const h = 26 * sc, w = 18 * sc;
      const tri = (cy, ww, hh) => '<path d="M' + x + ',' + (cy - hh) + ' L' + (x - ww) + ',' + cy + ' L' + (x + ww) + ',' + cy + ' Z" fill="#3F7D4E"/>';
      return '<rect x="' + (x - 1.4) + '" y="' + (by - 3) + '" width="2.8" height="6" fill="#6B4A2E"/>' +
        tri(by - 1, w * 0.55, h * 0.5) + tri(by - 1 - h * 0.32, w * 0.45, h * 0.5) + tri(by - 1 - h * 0.62, w * 0.34, h * 0.5);
    };
    const fire = (x, by, on) => {
      let f = '<line x1="' + (x - 7) + '" y1="' + by + '" x2="' + (x + 7) + '" y2="' + (by - 4) + '" stroke="#7A5230" stroke-width="3" stroke-linecap="round"/>' +
        '<line x1="' + (x - 7) + '" y1="' + (by - 4) + '" x2="' + (x + 7) + '" y2="' + by + '" stroke="#7A5230" stroke-width="3" stroke-linecap="round"/>';
      if (on) {
        f += '<path d="M' + x + ',' + (by - 20) + ' C' + (x - 8) + ',' + (by - 10) + ' ' + (x - 5) + ',' + (by - 2) + ' ' + x + ',' + (by - 3) +
          ' C' + (x + 5) + ',' + (by - 2) + ' ' + (x + 8) + ',' + (by - 10) + ' ' + x + ',' + (by - 20) + ' Z" fill="#FF9E42"/>';
        f += '<path d="M' + x + ',' + (by - 13) + ' C' + (x - 4) + ',' + (by - 8) + ' ' + (x - 2) + ',' + (by - 4) + ' ' + x + ',' + (by - 4) +
          ' C' + (x + 2) + ',' + (by - 4) + ' ' + (x + 4) + ',' + (by - 8) + ' ' + x + ',' + (by - 13) + ' Z" fill="#FFD24D"/>';
      }
      return f;
    };
    const tent = (x, by) => {
      const hw = 22, ah = 30;
      return '<path d="M' + x + ',' + (by - ah) + ' L' + (x - hw) + ',' + by + ' L' + (x + hw) + ',' + by + ' Z" fill="currentColor"/>' +
        '<path d="M' + x + ',' + (by - ah) + ' L' + (x + hw) + ',' + by + ' L' + x + ',' + by + ' Z" fill="rgba(0,0,0,.16)"/>' +
        '<path d="M' + x + ',' + (by - ah + 7) + ' L' + (x - 7) + ',' + by + ' L' + (x + 7) + ',' + by + ' Z" fill="rgba(0,0,0,.3)"/>' +
        '<line x1="' + x + '" y1="' + (by - ah) + '" x2="' + x + '" y2="' + (by - ah - 5) + '" stroke="currentColor" stroke-width="2"/>';
    };

    let s = '<svg class="cd-bg" viewBox="0 0 240 160" preserveAspectRatio="xMidYMax slice" aria-hidden="true">';
    s += '<path d="M0,138 Q70,126 140,132 T240,130 L240,160 L0,160 Z" fill="currentColor" opacity=".09"/>';
    s += tree(126, 134, 0.7) + tree(150, 130, 1) + tree(224, 132, 0.8);
    s += '<path d="M16,142 Q120,108 196,130" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>';
    s += fire(170, 146, lit);
    s += tent(196, 134);
    s += '<circle cx="' + mx + '" cy="' + my + '" r="8" fill="currentColor" opacity=".2"/>';
    if (showFlag) {
      s += '<line x1="' + mx + '" y1="' + my + '" x2="' + mx + '" y2="' + (mk[1] - 15).toFixed(1) + '" stroke="currentColor" stroke-width="1.6"/>';
      s += '<path d="M' + mx + ',' + (mk[1] - 15).toFixed(1) + ' l8,3 l-8,3 z" fill="currentColor"/>';
    }
    s += '<circle cx="' + mx + '" cy="' + my + '" r="4.5" fill="currentColor" stroke="#fff" stroke-width="1.6"/>';
    return s + '</svg>';
  }

  function secOverview(trip) {
    const days = tripDays(trip);
    const du = daysUntil(trip.startDate);
    const dueEnd = daysUntil(trip.endDate);
    let countTitle, countVal, countSub, pillClass = "ember";
    if (du === null) { countVal = "—"; countTitle = "Countdown"; countSub = "Set trip dates to start the countdown"; pillClass="muted"; }
    else if (du > 0) { countVal = du; countTitle = "Days to go"; countSub = "Departure " + fmtDate(trip.startDate,"long"); }
    else if (du <= 0 && dueEnd >= 0) { countVal = "Now"; countTitle = "Trip in progress"; countSub = "Wraps " + fmtDate(trip.endDate,"long"); pillClass="green"; }
    else { countVal = "✓"; countTitle = "Trip complete"; countSub = "Hope it was a good one"; pillClass="muted"; }

    const packedTotal = trip.packing.length;
    const packedDone = trip.packing.filter(x=>x.packed).length;
    const packPct = packedTotal ? Math.round(packedDone/packedTotal*100) : 0;
    const mealsPlanned = trip.meals.filter(m=>m.name).length;
    const guestsYes = trip.guests.filter(g=>g.rsvp==="Yes").length;
    const shopLeft = trip.shopping.filter(x=>!x.gotIt).length;
    const budgetTotal = trip.budget.reduce((s,e)=>s+(Number(e.amount)||0),0);
    const checkLeft = trip.checklist.filter(c=>!c.done).length;

    // today's / first day schedule
    const t = todayISO();
    let focusDay = days.indexOf(t) >= 0 ? t : days[0];
    const daySched = trip.schedule.filter(s=>s.day===focusDay).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
    // first weather day
    const wx = (trip.weather||[]).find(w=>w.date===focusDay) || (trip.weather||[])[0];

    let html = '<div class="page-head"><div><h2>'+esc(trip.name)+'</h2>' +
      '<p>'+(trip.location?'<span class="label" style="text-transform:none;letter-spacing:0;font-size:.95rem">'+esc(trip.location)+(trip.site?' · '+esc(trip.site):"")+'</span>':"Add a location in trip details") + '</p></div>' +
      '<div style="text-align:right"><div class="label">'+esc(fmtRange(trip.startDate, trip.endDate)||"No dates set")+'</div></div></div>';

    // hero stats
    // upcoming meal (next dish on or after today)
    const sortedMeals = trip.meals.filter(m => m.name).slice().sort((a, b) =>
      (a.day||"").localeCompare(b.day||"") || (((MEAL_ORDER[a.type]!=null?MEAL_ORDER[a.type]:9)) - ((MEAL_ORDER[b.type]!=null?MEAL_ORDER[b.type]:9))));
    const nextMeal = sortedMeals.find(m => (m.day||"") >= t) || sortedMeals[0] || null;
    let mealTile;
    if (nextMeal) {
      const when = (nextMeal.day ? fmtDate(nextMeal.day, "dow") : "") + (nextMeal.type ? " · " + nextMeal.type : "");
      const ic = mealIngredients(trip, nextMeal).length;
      const isub = ic ? (ic + " ingredient" + (ic===1?"":"s") + " listed") : "on the menu";
      mealTile = '<div class="card stat"><div class="label">Upcoming meal'+(when?" · "+esc(when):"")+'</div>' +
        '<div class="val" style="font-size:1.35rem;line-height:1.25;margin-top:8px">'+esc(nextMeal.name)+'</div>' +
        '<div class="sub">'+esc(isub)+'</div></div>';
    } else {
      mealTile = '<div class="card stat"><div class="label">Upcoming meal</div>' +
        '<div class="val" style="font-size:1.35rem;margin-top:8px;color:var(--muted)">—</div><div class="sub">No meals planned yet</div></div>';
    }
    // countdown — trail-to-camp scene
    let cdUnit = "";
    if (du === null) cdUnit = "";
    else if (du > 0) cdUnit = du === 1 ? "day to go" : "days to go";
    else if (dueEnd >= 0) cdUnit = "you’re here";
    else cdUnit = "";
    const countdownTile = '<div class="card stat cd-tile" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center">' +
      trailScene(du, dueEnd) +
      '<div class="cd-fg"><span class="cd-num">'+countVal+'</span>'+(cdUnit?'<span class="cd-unit">'+esc(cdUnit)+'</span>':"")+'<span class="label cd-sub">'+esc(countSub)+'</span></div>' +
    '</div>';
    html += '<div class="grid cols-3 section-block">' +
      countdownTile +
      statTile("Packing", '<span class="num">'+packPct+'%</span>', packedDone+" of "+packedTotal+" packed", "", packPct) +
      mealTile +
    '</div>';

    html += myJobsCard(trip);

    html += '<div class="grid cols-2">';

    // schedule card
    html += '<div class="card card-pad"><div class="section-title"><div><h3>'+(focusDay===t?"Today":fmtDate(focusDay,"dow")+"’s plan")+'</h3>' +
      '<div class="label">'+esc(fmtDate(focusDay,"long")||"Schedule")+'</div></div>' +
      '<button class="btn sm" data-action="nav" data-section="schedule">Full schedule</button></div>';
    if (daySched.length) {
      html += '<div class="timeline">' + daySched.slice(0,6).map(s => { const st = schedTypeOf(s); const ic = st.icon();
        return '<div class="tl-item" style="--dot:'+st.color+'"><span class="tl-time num">'+esc(fmt12(s.time))+'</span><div style="flex:1"><div class="row-title">'+(ic?'<span class="sched-ic" style="color:'+st.color+'">'+ic+'</span>':"")+esc(s.activity)+'</div>'+(s.notes?'<div class="row-sub">'+esc(s.notes)+'</div>':"")+'</div></div>'; }).join("") + '</div>';
    } else html += '<p style="color:var(--muted);margin:8px 0 0">Nothing scheduled for this day yet.</p>';
    html += '</div>';

    // weather + quick facts card
    html += '<div style="display:flex;flex-direction:column;gap:16px;height:100%">';
    const hasForecast = wx && (wx.high || wx.low || wx.condition);
    if (hasForecast) {
      const okind = condIcon(wx.condition); const osc = wxScene(okind);
      html += '<div class="card card-pad wx-scened" style="flex:1;min-height:150px;background:'+osc.grad+';color:'+osc.ink+'">' +
        wxSceneLayer(okind) +
        '<div class="section-title" style="margin-bottom:12px"><h3>Weather</h3><button class="btn sm" data-action="nav" data-section="weather">All days</button></div>' +
        '<div style="display:flex;align-items:baseline;gap:10px">' +
          '<span class="wx-hi" style="font-family:var(--font-display);font-size:2.7rem;font-weight:600;line-height:1">'+esc(wx.high||"—")+'°</span>' +
          '<span class="lo"> / '+esc(wx.low||"—")+'°</span>' +
          '<span class="cond" style="margin-left:auto;font-weight:600">'+esc(wx.condition||"—")+'</span></div>' +
        '<div class="row-sub" style="margin-top:6px">'+esc(fmtDate(wx.date,"long"))+(wx.precip?' · '+esc(wx.precip)+' precip':"")+'</div></div>';
    } else {
      html += '<div class="card card-pad" id="ovWx" style="flex:1;min-height:150px">' +
        '<div class="section-title"><h3>Weather</h3><button class="btn sm" data-action="nav" data-section="weather">All days</button></div>' +
        '<p class="row-sub" style="margin:10px 0 0">Loading live conditions…</p></div>';
    }
    html += '</div>'; // right col
    html += '</div>'; // grid

    return html;
  }
  function statTile(label, val, sub, tone, pct) {
    return '<div class="card stat'+(tone?" tone-"+tone:"")+'"><div class="label">'+esc(label)+'</div><div class="val" style="'+(tone==="ember"?"color:var(--ember)":"")+'">'+val+'</div>' +
      (pct!=null?'<div class="progress" style="margin-top:10px"><span style="width:'+pct+'%;background:var(--muted)"></span></div>':'<div class="sub">'+esc(sub)+'</div>') + '</div>';
  }
  function myJobsCard(trip) {
    const who = whoAmI();
    if (!who) {
      return '<div class="card card-pad section-block" style="display:flex;align-items:center;gap:14px;background:var(--accent-soft)">' +
        '<span class="avatar" style="width:40px;height:40px">?</span>' +
        '<div style="flex:1;min-width:0"><div class="row-title">See what you\'re on the hook for</div>' +
        '<div class="row-sub">Pick who you are — your roles, items to buy and gear to bring show up here.</div></div>' +
        '<button class="btn primary sm" data-action="change-who">Choose your name</button></div>';
    }
    const mid = myPersonId(trip);
    const roles = mid ? trip.roles.filter(r => r.personId === mid) : [];
    const shop = mid ? trip.shopping.filter(s => !s.gotIt && (s.assignedIds||[]).indexOf(mid) >= 0) : [];
    const gear = mid ? trip.packing.filter(p => !p.packed && (p.personIds||[]).indexOf(mid) >= 0) : [];
    const mine = myPersonalList(trip) || [];
    const personalLeft = mine.filter(x => !x.packed).length;
    const g = mid ? trip.guests.find(x => x.personId === mid) : null;
    const driving = !!(g && g.driver);
    const total = roles.length + shop.length + gear.length + personalLeft;

    const jobRow = (icon, label, sample, pillTxt, tone, section) =>
      '<button class="row-item" data-action="nav" data-section="'+section+'" style="width:100%;text-align:left;background:none;border-left:none;border-right:none;border-top:none;cursor:pointer">' +
        '<span style="color:var(--accent);display:inline-flex;width:20px;flex:none">'+icon+'</span>' +
        '<div class="row-main"><div class="row-title" style="font-weight:500">'+esc(label)+'</div>'+(sample?'<div class="row-sub" style="margin-top:2px">'+esc(sample)+'</div>':"")+'</div>' +
        '<span class="pill '+tone+'">'+esc(pillTxt)+'</span></button>';
    const preview = (arr, field) => { const names = arr.map(x=>x[field]); const head = names.slice(0,3).join(", "); return head + (names.length>3?" +"+(names.length-3)+" more":""); };

    let body = "";
    if (roles.length) body += jobRow(I.roles, roles.length===1?"1 role":roles.length+" roles", preview(roles,"title"), String(roles.length), "info", "roles");
    if (shop.length)  body += jobRow(I.shopping, shop.length+" thing"+(shop.length===1?"":"s")+" to buy", preview(shop,"item"), String(shop.length), "ember", "shopping");
    if (gear.length)  body += jobRow(I.packing, gear.length+" group item"+(gear.length===1?"":"s")+" to bring", preview(gear,"item"), String(gear.length), "ember", "packing");
    if (personalLeft) body += jobRow(I.packing, personalLeft+" personal item"+(personalLeft===1?"":"s")+" to pack", "Your own bag", String(personalLeft), "accent", "packing");
    if (driving)      body += jobRow(I.guests, "You're driving", (g.carpool?("Carpool: "+g.carpool):"")+((Number(g.seats)>0)?((g.carpool?" · ":"")+g.seats+" spare seats"):""), "🚗", "info", "guests");

    let card = '<div class="section-block"><div class="section-title"><h3>Your jobs · '+esc(who)+'</h3>' +
      '<span class="label">'+((total||driving)?(total+" to do"):"all clear")+'</span></div>';
    if (!total && !driving) {
      card += '<div class="card card-pad" style="display:flex;align-items:center;gap:12px;background:var(--accent-soft)"><span style="font-size:1.5rem">🎉</span>' +
        '<div><div class="row-title">You\'re all caught up</div><div class="row-sub">Nothing assigned to you right now.</div></div></div>';
    } else {
      card += '<div class="card"><div class="list card-pad" style="padding-top:4px;padding-bottom:4px">'+body+'</div></div>';
    }
    return card + '</div>';
  }
  function glanceRow(label, val, section) {
    return '<button class="row-item" data-action="nav" data-section="'+section+'" style="width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;cursor:pointer">' +
      '<span class="row-main"><span class="row-title" style="font-weight:400">'+esc(label)+'</span></span>' +
      '<span class="pill muted">'+esc(val)+'</span></button>';
  }

  /* ---------- Weather ---------- */
  function secWeather(trip) {
    const days = tripDays(trip);
    let html = pageHead("Info", "", "");
    // Live weather
    html += '<div class="card card-pad" id="liveWx" style="margin-bottom:18px">'+liveWxShell('<p style="color:var(--muted);margin:8px 0 0">Loading current conditions…</p>')+'</div>';

    // Sunrise / sunset
    html += '<div class="card card-pad daylight-card" id="sunTimes" style="margin-bottom:18px">' +
      '<div class="section-title" style="margin-bottom:6px"><div><h3>Daylight</h3><div class="label">Sunrise &amp; sunset</div></div></div>' +
      '<div id="sunTimesBody"><p class="row-sub" style="margin:8px 0 0;color:var(--muted)">Loading sun times…</p></div></div>';

    // Daily forecast (directly under live weather)
    html += '<div class="section-title"><h3>Daily forecast</h3></div>';
    if (!days.length) {
      html += '<div class="card card-pad" style="color:var(--muted)">Set trip dates in Edit trip to lay out the daily forecast.</div>';
    } else {
      html += '<div class="card card-pad" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;background:var(--info-soft);border-color:transparent">' +
        '<span class="label" style="color:var(--info)">Tip</span><span style="font-size:.9rem;color:var(--ink)">Live forecast fills in automatically within ~16 days of the trip. Tap a day to see it hour by hour.</span></div>';
      html += '<div class="wx-grid">';
      days.forEach(d => {
        const w = (trip.weather||[]).find(x => x.date === d) || { date: d };
        const filled = w.high || w.low || w.condition;
        const kind = filled ? condIcon(w.condition) : null;
        const sc = kind ? wxScene(kind) : null;
        const cardStyle = sc ? 'text-align:left;cursor:pointer;min-height:200px;background:'+sc.grad+';color:'+sc.ink : 'text-align:left;cursor:pointer;min-height:200px;color:inherit';
        html += '<button class="card wx'+(sc?' wx-scened':'')+'" data-action="day-forecast" data-id="'+d+'" style="'+cardStyle+'">' +
          (sc ? wxSceneLayer(kind) : '') +
          '<div class="label">'+esc(fmtDate(d,"dow"))+' · '+esc(fmtDate(d,"md"))+'</div>' +
          '<div class="wx-body" id="infowx_'+esc(d)+'">' +
          (filled ?
            '<div class="temps" style="margin-top:6px"><span class="hi" style="font-size:2rem">'+esc(w.high||"—")+'°</span><span class="lo"> / '+esc(w.low||"—")+'°</span></div>' +
            '<div class="cond" style="font-weight:600">'+esc(w.condition||"—")+'</div>' +
            (w.precip?'<div class="row-sub" style="margin-top:6px">Precip: '+esc(w.precip)+'</div>':"") +
            (w.notes?'<div class="row-sub">'+esc(w.notes)+'</div>':"") +
            '<div class="row-sub">Your note · tap for the full day</div>'
            : '<div class="temps"><span class="hi" style="color:var(--muted)">—</span></div><div class="cond" style="color:var(--muted);font-size:.85rem">Loading forecast…</div>') +
          '</div></button>';
      });
      html += '</div>';
    }

    // Check-in / Check-out
    html += '<div class="section-title" style="margin-top:22px"><h3>Check-in &amp; check-out</h3></div>';
    html += '<div class="card card-pad" style="display:flex;gap:28px;flex-wrap:wrap;align-items:center">' +
      '<div><div class="label">Check-in</div><div style="font-family:var(--font-display);font-size:1.4rem;margin-top:4px">'+esc(trip.checkin||"—")+'</div></div>' +
      '<div><div class="label">Check-out</div><div style="font-family:var(--font-display);font-size:1.4rem;margin-top:4px">'+esc(trip.checkout||"—")+'</div></div>' +
      (!(trip.checkin || trip.checkout) ? '<button class="btn sm" data-action="edit-trip" style="margin-left:auto">Set times</button>' : '<button class="btn sm" data-action="edit-trip" style="margin-left:auto">Edit</button>') +
      '</div>';

    // Park office
    html += '<div class="section-title" style="margin-top:22px"><h3>Park office</h3></div>';
    if (trip.parkPhone) {
      const telHref = "tel:" + String(trip.parkPhone).replace(/[^\d+]/g, "");
      html += '<div class="card card-pad" style="display:flex;gap:12px 14px;align-items:center;flex-wrap:wrap">' +
        '<span class="wx-ic" style="flex:none">'+I.phone+'</span>' +
        '<div style="flex:1 1 150px;min-width:0"><div class="label">'+esc(trip.location||"Park office")+'</div>' +
        '<div style="font-family:var(--font-display);font-size:1.3rem;margin-top:2px;white-space:nowrap">'+esc(trip.parkPhone)+'</div></div>' +
        '<div style="display:flex;gap:8px;align-items:center;flex:none;margin-left:auto">' +
          '<a class="btn primary" href="'+esc(telHref)+'">'+I.phone+' Call</a>' +
          '<button class="btn sm" data-action="edit-trip">Edit</button>' +
        '</div>' +
        '</div>';
    } else {
      html += '<div class="card card-pad" style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap">' +
        '<span class="row-sub" style="color:var(--muted)">Add the park office number so anyone can call quickly.</span>' +
        '<button class="btn sm" data-action="edit-trip">Add number</button></div>';
    }

    // Location + Emergency services
    if (trip.location || (trip.lat && trip.lon)) {
      const q = (trip.lat && trip.lon) ? (trip.lat + "," + trip.lon) : trip.location;
      const enc = encodeURIComponent(q);
      const hosp = encodeURIComponent("hospital near " + q);
      html += '<div class="section-title" style="margin-top:22px"><h3>Location</h3></div>';
      html += '<div class="card" style="overflow:hidden;margin-bottom:18px">' +
        '<iframe title="Location map" src="https://maps.google.com/maps?q='+enc+'&z=12&output=embed" style="width:100%;height:300px;border:0;display:block" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>' +
        '<div class="card-pad" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">' +
          '<span class="row-sub">'+esc(trip.location||"")+(trip.site?' · '+esc(trip.site):"")+'</span>' +
          '<a class="btn sm" href="https://www.google.com/maps/search/?api=1&query='+enc+'" target="_blank" rel="noopener">Open in Google Maps</a></div></div>';

      html += '<div class="section-title"><h3>Emergency services</h3></div>';
      html += '<div class="card" style="overflow:hidden;margin-bottom:18px">' +
        '<div class="card-pad" style="display:flex;align-items:center;gap:12px;background:var(--danger-soft)">' +
          '<span class="pill danger" style="font-weight:700">Call 911</span>' +
          '<span class="row-sub" style="color:var(--ink)">In any emergency, call <b>911</b>.</span></div>' +
        '<div class="card-pad"><a class="btn primary" href="https://www.google.com/maps/search/?api=1&query='+hosp+'" target="_blank" rel="noopener" style="justify-content:center;width:100%">Find nearest hospital / ER on Google Maps</a></div></div>';
    }
    return html;
  }

  /* ---------- Meals ---------- */
  const MEAL_ORDER = { "Breakfast":0, "Lunch":1, "Dinner":2, "Snack":3, "Drinks":4 };
  const MEAL_TONE = { "Breakfast":"warn", "Lunch":"info", "Dinner":"green", "Snack":"ember", "Drinks":"info" };
  function mealIngredients(trip, m) { return (trip.shopping || []).filter(s => s.mealId === m.id); }
  function addMealIngredient(mealId, val, qty) {
    val = (val||"").trim(); if (!val) return;
    qty = (qty||"").trim();
    const t = activeTrip(); const m = findById(t.meals, mealId); if (!m) return;
    t.shopping.push({ id: uid(), item: val, category: foodOrDrink(val), qty: qty, forMeal: m.name, mealId: m.id, gotIt: false, assignedIds: [] });
    expandedMeals[mealId] = true;
    save(); logActivity("added ingredient “"+val+"”"+(qty?" (×"+qty+")":"")+" for “"+m.name+"”"); render(); toast("Added to the shopping list");
  }
  function wireMeals() {
    document.querySelectorAll(".ming-input").forEach(inp => {
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); const q = document.getElementById("mingq_"+inp.dataset.id); addMealIngredient(inp.dataset.id, inp.value, q?q.value:""); } });
    });
    document.querySelectorAll(".ming-qty").forEach(inp => {
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); const it = document.getElementById("ming_"+inp.dataset.id); addMealIngredient(inp.dataset.id, it?it.value:"", inp.value); } });
    });
  }
  function secMeals(trip) {
    let html = pageHead("Meals", "What you're eating, and the ingredients you need.", addBtn("add-meal","Add meal"));
    const days = tripDays(trip);
    if (!trip.meals.length) return html + emptyState(I.meals, "No meals planned yet. Build out the menu day by day.", "add-meal", "Add first meal");
    const groups = days.length ? days.slice() : [];
    trip.meals.forEach(m => { if (groups.indexOf(m.day) < 0) groups.push(m.day || ""); });
    groups.forEach(day => {
      const meals = trip.meals.filter(m => (m.day||"") === (day||"")).sort((a,b)=>(MEAL_ORDER[a.type]??9)-(MEAL_ORDER[b.type]??9));
      if (!meals.length) return;
      html += '<div class="day-head"><h4>'+esc(day?fmtDate(day,"long"):"Unscheduled")+'</h4></div>';
      html += '<div class="card"><div class="list card-pad" style="padding-top:4px;padding-bottom:4px">';
      meals.forEach(m => {
        const ings = mealIngredients(trip, m);
        const exp = !!expandedMeals[m.id];
        html += '<div class="row-item meal-item">' +
          '<span class="pill '+(MEAL_TONE[m.type]||"green")+'" style="min-width:74px;justify-content:center">'+esc(m.type||"Meal")+'</span>' +
          '<div class="row-main"><div class="row-title">'+esc(m.name||"(unnamed)")+'</div>' +
          (m.notes?'<div class="row-sub">'+esc(m.notes)+'</div>':"") + '</div>' +
          '<button class="btn sm ming-toggle'+(exp?" on":"")+'" data-action="toggle-meal-ing" data-id="'+m.id+'">'+I.shopping+' Ingredients'+(ings.length?' · '+ings.length:"")+'</button>' +
          rowActions("edit-meal","del-meal",m.id) + '</div>';
        if (exp) {
          html += '<div class="ming-panel">' +
            (ings.length
              ? '<div class="ming-list">' + ings.map(s => '<span class="bringer'+(s.gotIt?" done-ing":"")+'">'+esc(s.item)+(s.qty?' <span style="opacity:.65;font-weight:500">×'+esc(s.qty)+'</span>':"")+'<button class="bx" data-action="del-meal-ing" data-id="'+s.id+'" title="Remove">×</button></span>').join("") + '</div>'
              : '<div class="row-sub" style="margin-bottom:10px">No ingredients yet — add them here and they\'ll appear on the Shopping list, linked to this meal.</div>') +
            '<div style="display:flex;gap:8px"><input type="text" class="ming-input" id="ming_'+m.id+'" data-id="'+m.id+'" placeholder="Add an ingredient…"><input type="text" class="ming-qty" id="mingq_'+m.id+'" data-id="'+m.id+'" placeholder="Qty" aria-label="Quantity"><button class="btn primary sm" data-action="add-meal-ing" data-id="'+m.id+'">'+I.plus+' Add</button></div>' +
          '</div>';
        }
      });
      html += '</div></div>';
    });
    return html;
  }
  function mealFields(trip) {
    const days = tripDays(trip);
    return [
      { key:"day", label:"Day", type:"select", options: () => (days.length?days:[""]).map(d => ({value:d, label: d?fmtDate(d,"long"):"Unscheduled"})) },
      { key:"type", label:"Meal", type:"select", options:["Breakfast","Lunch","Dinner","Snack","Drinks"] },
      { key:"name", label:"Dish / menu", type:"text", required:true, placeholder:"e.g. Steak BBQ" },
      { key:"notes", label:"Notes", type:"textarea", placeholder:"Prep or dietary notes… (add ingredients from the meal's Ingredients list)" },
    ];
  }

  /* ---------- Shopping ---------- */
  // A collapsible "Done" section that collects checked-off items at the very bottom of a list.
  function doneSection(key, count, rowsHtml) {
    const isCol = !!collapsedCats[key];
    let h = '<div class="day-head cat-head done-head'+(isCol?" collapsed":"")+'" data-action="toggle-cat" data-key="'+esc(key)+'"><span class="chev">'+I.chevron+'</span><h4>Done</h4><span class="label">'+count+'</span></div>';
    if (isCol) return h;
    return h + '<div class="card done-card"><div class="list card-pad" style="padding-top:4px;padding-bottom:4px">'+rowsHtml+'</div></div>';
  }
  function renderShopRow(trip, s) {
    const priced = Number(s.price) > 0;
    const nSplit = (s.splitAmong && s.splitAmong.length) ? s.splitAmong.length : trip.people.length;
    const sub = [];
    if (s.forMeal) sub.push("for " + esc(s.forMeal));
    if (s.gotIt && priced) sub.push("paid by " + (esc(personName(trip, s.paidBy)) || "someone") + " · split " + nSplit + " way" + (nSplit === 1 ? "" : "s"));
    let priceCtl = "";
    if (s.gotIt) priceCtl = priced
      ? '<button class="pill green" data-action="shop-price" data-id="'+s.id+'" title="Edit price">'+money(s.price)+'</button>'
      : '<button class="btn sm" data-action="shop-price" data-id="'+s.id+'" style="color:var(--muted)">+ add price</button>';
    return '<div class="row-item'+(s.gotIt?" done":"")+'">' +
      '<input type="checkbox" class="check" '+(s.gotIt?"checked":"")+' data-action="toggle-shop" data-id="'+s.id+'">' +
      '<div class="row-main"><div class="row-title">'+esc(s.item)+(s.qty?' <span class="label" style="text-transform:none;letter-spacing:0">· '+esc(s.qty)+'</span>':"")+(s.category?' <span class="tag-cat">'+esc(s.category)+'</span>':"")+'</div>' +
      (sub.length?'<div class="row-sub">'+sub.join(" · ")+'</div>':"") + '</div>' +
      (s.gotIt ? "" : storeControl(trip, s)) +
      (s.gotIt ? "" : assignControl(trip, s, s.assignedIds, "addassign-shop", "removeassign-shop", "+ Assign")) +
      priceCtl +
      rowActions("edit-shop","del-shop",s.id) + '</div>';
  }
  function secShopping(trip) {
    const left = trip.shopping.filter(x=>!x.gotIt).length;
    const spent = shoppingSpent(trip);
    let html = pageHead("Shopping List", left+" item"+(left===1?"":"s")+" still to buy"+(spent>0?' · <span class="num">'+money(spent)+'</span> spent so far':"")+".",
      addBtn("add-shop","Add item"));
    if (!trip.shopping.length) return html + emptyState(I.shopping, "Nothing on the list yet. Add supplies and groceries.", "add-shop", "Add first item");
    html += filterBar(trip, "shopping", filterShopping);
    html += '<datalist id="shopstores">' + knownStores(trip).map(o => '<option value="'+esc(o)+'"></option>').join("") + '</datalist>';
    const NO_STORE = "␀nostore";
    const groups = {}, done = [];
    trip.shopping.forEach(s => {
      if (!matchFilter(s.assignedIds, filterShopping)) return;
      if (s.gotIt) { done.push(s); return; }
      const st = (s.store||"").trim() || NO_STORE; (groups[st]=groups[st]||[]).push(s);
    });
    const storeNames = Object.keys(groups);
    if (!storeNames.length && !done.length) return html + '<div class="card card-pad" style="color:var(--muted)">No items match this filter.</div>';
    storeNames.sort((a, b) => { if (a === NO_STORE) return 1; if (b === NO_STORE) return -1; return a.localeCompare(b); });
    storeNames.forEach(st => {
      const items = groups[st];
      const isNo = st === NO_STORE;
      const label = isNo ? "No store yet" : st;
      const key = "SHOPSTORE:" + st, isCol = !!collapsedCats[key];
      html += '<div class="day-head cat-head'+(isCol?" collapsed":"")+'" data-action="toggle-cat" data-key="'+esc(key)+'"><span class="chev">'+I.chevron+'</span><h4>'+(isNo?"":'<span class="store-emo">🛒</span> ')+esc(label)+'</h4><span class="label">'+items.length+'</span></div>';
      if (isCol) return;
      html += '<div class="card"><div class="list card-pad" style="padding-top:4px;padding-bottom:4px">';
      items.forEach(s => { html += renderShopRow(trip, s); });
      html += '</div></div>';
    });
    if (done.length) html += doneSection("SHOPDONE", done.length, done.map(s => renderShopRow(trip, s)).join(""));
    return html;
  }
  function knownStores(trip) { return Array.from(new Set((trip.shopping || []).map(s => (s.store || "").trim()).filter(Boolean))).sort((a, b) => a.localeCompare(b)); }
  function storeControl(trip, s) {
    return '<input class="store-input" type="text" list="shopstores" data-action="set-shop-store" data-id="' + s.id + '" value="' + esc(s.store || "") + '" placeholder="+ Store" autocomplete="off">';
  }
  function shopFields(trip) {
    const cats = ["Food","Drinks","Camp Supplies","Personal","Cooking Gear","Other"];
    return [
      { key:"item", label:"Item", type:"text", required:true, placeholder:"e.g. Charcoal" },
      { key:"qty", label:"Quantity", type:"text", placeholder:"e.g. 2 bags", row:true },
      { key:"store", label:"Store", type:"datalist", options: (t) => knownStores(t), placeholder:"e.g. Costco, Metro, Canadian Tire" },
      { key:"category", label:"Category", type:"select", options: cats },
      { key:"mealRef", label:"For meal (optional)", type:"mealselect" },
    ];
  }

  /* ---------- Roles ---------- */
  function secRoles(trip) {
    let html = pageHead("Roles & Responsibilities", "Who's got what covered.", addBtn("add-role","Add role"));
    if (!trip.people.length) html += noPeopleNote();
    if (!trip.roles.length) return html + emptyState(I.roles, "No roles yet. Assign responsibilities so nothing slips.", "add-role", "Add first role");
    html += '<div class="grid cols-2">';
    trip.roles.forEach(r => {
      html += '<div class="card card-pad" style="display:flex;align-items:flex-start;gap:14px">' +
        personBadge(trip, r.personId) +
        '<div style="flex:1;min-width:0"><div class="row-title">'+esc(r.title)+'</div>' +
        '<div class="row-sub">'+(r.personId?esc(personName(trip,r.personId)):"Unassigned")+(r.notes?' · '+esc(r.notes):"")+'</div></div>' +
        rowActions("edit-role","del-role",r.id) + '</div>';
    });
    html += '</div>';
    return html;
  }
  function roleFields() {
    return [
      { key:"title", label:"Responsibility", type:"text", required:true, placeholder:"e.g. Fire Keeper" },
      { key:"personId", label:"Assigned to", type:"person" },
      { key:"notes", label:"Notes", type:"text", placeholder:"Optional detail" },
    ];
  }

  /* ---------- Schedule ---------- */
  const SCHED_TYPES = {
    "Activity":  { tone:"accent", color:"var(--accent)", icon:() => I.overview },
    "Meal":      { tone:"ember",  color:"var(--ember)",  icon:() => I.meals },
    "Travel":    { tone:"info",   color:"var(--info)",   icon:() => I.car },
    "Setup":     { tone:"warn",   color:"var(--warn)",   icon:() => I.tent },
    "Free time": { tone:"info",   color:"var(--info)",   icon:() => I.coffee },
    "Other":     { tone:"muted",  color:"var(--muted)",  icon:() => "" },
  };
  function schedTypeOf(s) { return SCHED_TYPES[s.type] || SCHED_TYPES["Activity"]; }
  function schedDateTime(day, time) {
    const d = parseDate(day); if (!d) return null;
    const parts = (time||"00:00").split(":"); d.setHours(Number(parts[0])||0, Number(parts[1])||0, 0, 0);
    return d;
  }
  // Show times to the user in 12-hour format; they're stored as 24h "HH:MM" so sorting stays correct.
  function fmt12(t) {
    if (!t) return "—";
    const m = /^(\d{1,2}):(\d{2})/.exec(t);
    if (!m) return t;
    let h = Number(m[1]); const min = m[2];
    const ap = h < 12 ? "AM" : "PM";
    h = h % 12; if (h === 0) h = 12;
    return h + ":" + min + " " + ap;
  }
  function secSchedule(trip) {
    let html = pageHead("Daily Schedule", "The plan, hour by hour.", addBtn("add-sched","Add item"));
    const days = tripDays(trip);
    if (!trip.schedule.length) return html + emptyState(I.schedule, "No schedule yet. Lay out arrival, activities and departure.", "add-sched", "Add first item");
    const groups = days.length ? days.slice() : [];
    trip.schedule.forEach(s => { if (groups.indexOf(s.day) < 0) groups.push(s.day||""); });
    const dayGroups = groups.filter(day => trip.schedule.some(s => (s.day||"")===(day||"")));

    // --- Now / Up next (only while the trip is in progress) ---
    const inProgress = days.indexOf(todayISO()) >= 0;
    let nowId = "", nextId = "", curItem = null, nextItem = null;
    if (inProgress) {
      const now = new Date();
      const seq = trip.schedule.map(s => ({ s, dt: schedDateTime(s.day, s.time) })).filter(x => x.dt).sort((a,b) => a.dt - b.dt);
      const nx = seq.find(x => x.dt > now);
      if (nx) { nextId = nx.s.id; nextItem = nx.s; }
      for (let i = seq.length - 1; i >= 0; i--) { if (seq[i].dt <= now) { if (seq[i].s.day === todayISO()) { nowId = seq[i].s.id; curItem = seq[i].s; } break; } }
    }
    if (inProgress && (curItem || nextItem)) {
      html += '<div class="card card-pad section-block" style="background:var(--ember-soft);border:none;display:flex;gap:22px;flex-wrap:wrap;align-items:center">';
      if (curItem) html += '<div><div class="label" style="color:var(--ember)">● Happening now</div>' +
        '<div class="row-title" style="font-size:1.05rem">'+esc(curItem.activity)+'</div>' +
        '<div class="row-sub">from '+esc(fmt12(curItem.time))+'</div></div>';
      if (nextItem) html += '<div style="'+(curItem?'border-left:1px solid var(--border-strong);padding-left:22px':'')+'">' +
        '<div class="label">Up next</div><div class="row-title" style="font-size:1.05rem">'+esc(nextItem.activity)+'</div>' +
        '<div class="row-sub">'+esc(fmtDate(nextItem.day,"dow"))+' · '+esc(fmt12(nextItem.time))+'</div></div>';
      html += '</div>';
    }

    // --- Day jump pills ---
    if (dayGroups.length > 1) {
      html += '<div class="filterbar sched-jumpbar">';
      dayGroups.forEach(day => { html += '<button class="chip-toggle" data-action="sched-jump" data-day="'+esc(day||"none")+'">'+esc(day?fmtDate(day,"dow"):"Other")+'</button>'; });
      html += '</div>';
    }

    dayGroups.forEach(day => {
      const items = trip.schedule.filter(s => (s.day||"")===(day||"")).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
      if (!items.length) return;
      const w = day ? (trip.weather||[]).find(x => x.date === day) : null;

            '<a class="btn sm" href="'+esc(mapUrl)+'" target="_blank" rel="noopener">'+I.pin+' Map</a>' +
            '<button class="btn sm" data-action="save-todo" data-title="'+esc(x.title)+'" data-url="'+esc(x.url)+'">'+I.star+' Save</button>' +
          '</div>' +
        '</div></div>';
    });
    html += '</div>';
    html += '<div class="label" style="margin-top:12px;text-transform:none;letter-spacing:0">Auto-discovered from Wikipedia (most relevant first). Double-check hours &amp; access before you go.</div>';
    return html;
  }

  /* ---------- Packing ---------- */
  const PERSONAL_CATS = ["Clothing","Toiletries","Health & Meds","Electronics","Documents","Other"];
  function myPersonalList(trip) {
    const who = whoAmI(); if (!who) return null;
    if (!trip.personalPacking || typeof trip.personalPacking !== "object" || Array.isArray(trip.personalPacking)) trip.personalPacking = {};
    if (!Array.isArray(trip.personalPacking[who])) trip.personalPacking[who] = [];
    return trip.personalPacking[who];
  }
  function personalStarter() {
    const mk = (item, category) => ({ id: uid(), item: item, category: category, packed: false });
    return [
      mk("Underwear (x3+)","Clothing"), mk("Socks (x3+)","Clothing"), mk("T-shirts","Clothing"),
      mk("Shorts / pants","Clothing"), mk("Warm layer / hoodie","Clothing"), mk("Pyjamas","Clothing"),
      mk("Swimsuit","Clothing"), mk("Rain jacket","Clothing"), mk("Hat & sunglasses","Clothing"),
      mk("Toothbrush & toothpaste","Toiletries"), mk("Deodorant","Toiletries"), mk("Shampoo / soap","Toiletries"),
      mk("Personal towel","Toiletries"), mk("Sunscreen","Toiletries"), mk("Bug spray","Toiletries"),
      mk("Personal medications","Health & Meds"), mk("Phone & charger","Electronics"), mk("Power bank","Electronics"),
      mk("ID / health card","Documents"), mk("Cash","Documents")
    ];
  }
  function packingCategoryBlocks(list, toggleAction, editAction, delAction, trip, showBringing, keyPrefix, filterSet) {
    let html = "";
    const cats = {}, done = [];
    list.forEach(p => {
      if (filterSet && !matchFilter(p.personIds, filterSet)) return;
      if (p.packed) { done.push(p); return; }
      const c = p.category || "Other"; (cats[c] = cats[c] || []).push(p);
    });
    const catNames = Object.keys(cats);
    if (!catNames.length && !done.length) return '<div class="card card-pad" style="color:var(--muted)">No items match this filter.</div>';
    function packRow(p, showCat) {
      const needTag = (showBringing && Number(p.needed) > 0) ? ' <span class="label" style="text-transform:none;letter-spacing:0">· need '+Number(p.needed)+'</span>' : "";
      return '<div class="row-item'+(p.packed?" done":"")+'">' +
        '<input type="checkbox" class="check" '+(p.packed?"checked":"")+' data-action="'+toggleAction+'" data-id="'+p.id+'">' +
        '<div class="row-main"><div class="row-title">'+esc(p.item)+needTag+(showCat&&p.category?' <span class="tag-cat">'+esc(p.category)+'</span>':"")+'</div>'+(showBringing?packQtySummary(p):"")+'</div>' +
        (showBringing ? groupBringers(trip, p) : "") +
        '<div class="row-actions"><button class="icon-btn" data-action="'+editAction+'" data-id="'+p.id+'" title="Edit">'+I.edit+'</button></div></div>';
    }
    catNames.forEach(cat => {
      const items = cats[cat];
      const key = (keyPrefix || "") + ":" + cat;
      const isCollapsed = !!collapsedCats[key];
      html += '<div class="day-head cat-head'+(isCollapsed?" collapsed":"")+'" data-action="toggle-cat" data-key="'+esc(key)+'">' +
        '<span class="chev">'+I.chevron+'</span><h4>'+esc(cat)+'</h4>' +
        '<span class="label">'+items.length+'</span></div>';
      if (isCollapsed) return;
      html += '<div class="card"><div class="list card-pad" style="padding-top:4px;padding-bottom:4px">';
      items.forEach(p => { html += packRow(p, false); });
      html += '</div></div>';
    });
    if (done.length) html += doneSection((keyPrefix || "") + ":__done__", done.length, done.map(p => packRow(p, true)).join(""));
    return html;
  }
  function progressCard(label, done, total) {
    const pct = total ? Math.round(done/total*100) : 0;
    return '<div class="card card-pad" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span class="label">'+esc(label)+'</span><span class="num" style="font-weight:600">'+done+' / '+total+'</span></div><div class="progress"><span style="width:'+pct+'%"></span></div></div>';
  }
  function packSecHead(key, title, sub, collapsed) {
    return '<div class="pack-sec-head'+(collapsed?" collapsed":"")+'" data-action="toggle-cat" data-key="'+esc(key)+'">' +
      '<span class="chev">'+I.chevron+'</span>' +
      '<div style="flex:1;min-width:0"><h3>'+title+'</h3><div class="label" style="margin-top:2px">'+esc(sub)+'</div></div></div>';
  }
  function openAddPackingChooser() {
    const overlay = document.getElementById("overlay");
    overlay.innerHTML = '<div class="modal" role="dialog" aria-modal="true" style="max-width:400px">' +
      '<div class="modal-head"><h3>Add packing item</h3><button class="icon-btn" data-close>'+I.x+'</button></div>' +
      '<div class="modal-body"><p class="row-sub" style="margin:-4px 0 4px">Which list should it go on?</p>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
        '<button type="button" class="btn primary" data-action="add-mypack" style="justify-content:center;padding:14px 18px">'+I.packing+' My personal list</button>' +
        '<button type="button" class="btn" data-action="add-pack" style="justify-content:center;padding:14px 18px">'+I.roles+' Group (shared) list</button>' +
      '</div></div></div>';
    overlay.classList.add("open");
  }
  function secPacking(trip) {
    let html = pageHead("Packing", "Your personal bag, plus the shared group gear.", "");
    html += '<div id="packWxNudge"></div>';
    const who = whoAmI();

    // ----- Personal (big collapsible) -----
    const pKey = "PACK:personal", pCollapsed = !!collapsedCats[pKey];
    html += packSecHead(pKey, "Your personal list"+(who?" · "+esc(who):""), "Only you see & edit this", pCollapsed);
    if (!pCollapsed) {
      if (!who) {
        html += '<div class="card card-pad empty">'+I.packing+'<p>Pick who you are to use your own personal packing list.</p><button class="btn primary" data-action="change-who" style="margin:0 auto">Choose your name</button></div>';
      } else {
        const mine = myPersonalList(trip);
        if (!mine.length) {
          html += '<div class="card card-pad empty">'+I.packing+'<p>Your personal list is empty.</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary" data-action="seed-mypack">Use a starter list</button><button class="btn" data-action="add-mypack">Add an item</button></div></div>';
        } else {
          html += progressCard("Your progress", mine.filter(x=>x.packed).length, mine.length);
          html += packingCategoryBlocks(mine, "toggle-mypack", "edit-mypack", "del-mypack", trip, false, "personal", null);
        }
      }
    }

    // ----- Group (big collapsible) -----
    const gKey = "PACK:group", gCollapsed = !!collapsedCats[gKey];
    html += packSecHead(gKey, "Group packing (shared)", "Everyone contributes — assign who brings each thing", gCollapsed);
    if (!gCollapsed) {
      if (!trip.packing.length) {
        html += emptyState(I.packing, "No shared gear yet.", "add-pack", "Add item");
      } else {
        html += progressCard("Group progress", trip.packing.filter(x=>x.packed).length, trip.packing.length);
        html += filterBar(trip, "packing", filterPacking);
        html += packingCategoryBlocks(trip.packing, "toggle-pack", "edit-pack", "del-pack", trip, true, "group", filterPacking);
      }
    }
    return html;
  }
  function packFields() {
    const cats = ["Shelter & Sleep","Kitchen & Cooking","Clothing","Personal & Health","Tools & Extras","Fun","Other"];
    return [
      { key:"item", label:"Item", type:"text", required:true, placeholder:"e.g. Sleeping bag" },
      { key:"category", label:"Category", type:"select", options: cats },
      { key:"needed", label:"How many needed (optional)", type:"number", placeholder:"e.g. 6", hint:"Leave blank for one-off gear. Set a total when several are needed and people split bringing them — each person then notes how many they'll bring." },
    ];
  }
  function bringerIds(p) { return Array.isArray(p.personIds) ? p.personIds : (p.personId ? [p.personId] : []); }
  function bringerQty(p, id) { return (p.qtys && p.qtys[id] != null) ? Number(p.qtys[id]) : 1; }
  function broughtTotal(p) { return bringerIds(p).reduce((s, id) => s + bringerQty(p, id), 0); }
  function packQtySummary(p) {
    const need = Number(p.needed) > 0 ? Number(p.needed) : 0;
    if (!need) return "";
    const got = broughtTotal(p);
    const ok = got >= need;
    const cls = ok ? "qsum-ok" : (got > 0 ? "qsum-short" : "qsum-none");
    const txt = got + " of " + need + (ok ? " ✓" : " · short " + (need - got));
    return '<div class="row-sub qsum ' + cls + '">bringing ' + esc(txt) + "</div>";
  }
  function groupBringers(trip, p) {
    const ids = bringerIds(p);
    const hasTarget = Number(p.needed) > 0;
    const chips = ids.map(id => {
      const n = personName(trip, id); if (!n) return "";
      const q = bringerQty(p, id);
      return '<span class="bringer qty-bringer" title="' + esc(n) + '">' +
        (hasTarget ? '<button class="qstep" data-action="bringer-dec-pack" data-id="' + p.id + '" data-person="' + id + '" aria-label="One fewer">−</button>' : "") +
        '<span class="qname">' + esc(n) + '</span>' +
        (hasTarget ? '<span class="qmult">×' + q + '</span><button class="qstep" data-action="bringer-inc-pack" data-id="' + p.id + '" data-person="' + id + '" aria-label="One more">+</button>' : "") +
        '<button class="bx" data-action="removebringer-pack" data-id="' + p.id + '" data-person="' + id + '" title="Remove ' + esc(n) + '">×</button>' +
        '</span>';
    }).join("");
    const remaining = (trip.people || []).filter(pp => ids.indexOf(pp.id) < 0);
    const addSel = '<select class="inline-select bringer-add" data-action="addbringer-pack" data-id="' + p.id + '" aria-label="Assign a person">' +
      '<option value="">' + (ids.length ? "+ Add" : "+ Who's bringing?") + "</option>" +
      remaining.map(pp => '<option value="' + pp.id + '">' + esc(pp.name) + "</option>").join("") + "</select>";
    return '<div class="bringers">' + chips + addSel + "</div>";
  }
  function assignControl(trip, item, ids, addAction, removeAction, addLabel) {
    ids = Array.isArray(ids) ? ids : [];
    const chips = ids.map(id => {
      const n = personName(trip, id); if (!n) return "";
      return '<span class="bringer" title="'+esc(n)+'">'+esc(n)+'<button class="bx" data-action="'+removeAction+'" data-id="'+item.id+'" data-person="'+id+'" title="Remove '+esc(n)+'">×</button></span>';
    }).join("");
    const remaining = (trip.people || []).filter(pp => ids.indexOf(pp.id) < 0);
    const addSel = '<select class="inline-select bringer-add" data-action="'+addAction+'" data-id="'+item.id+'" aria-label="Assign a person">' +
      '<option value="">'+(ids.length ? "+ Add" : (addLabel || "+ Assign"))+'</option>' +
      remaining.map(pp => '<option value="'+pp.id+'">'+esc(pp.name)+'</option>').join("") + '</select>';
    return '<div class="bringers">'+chips+addSel+'</div>';
  }
  function matchFilter(ids, set) {
    if (!set || set.size === 0) return true;
    if (set.has("__none__") && (!ids || ids.length === 0)) return true;
    return (ids || []).some(id => set.has(id));
  }
  function filterBar(trip, pageKey, set) {
    if (!(trip.people || []).length) return "";
    const chip = (label, val, on) => '<button class="chip-toggle'+(on?" on":"")+'" data-action="filter-toggle" data-page="'+pageKey+'" data-val="'+val+'">'+esc(label)+'</button>';
    const mid = myPersonId(trip);
    let html = '<div class="filterbar"><span class="flabel">Filter by</span>';
    html += chip("All", "__all__", set.size === 0);
    if (mid) html += chip("Just mine", "__mine__", set.size === 1 && set.has(mid));
    trip.people.forEach(p => { html += chip(p.name, p.id, set.has(p.id)); });
    html += chip("Unassigned", "__none__", set.has("__none__"));
    html += '</div>';
    return html;
  }

  /* ---------- Guests & Carpool ---------- */
  function secGuests(trip) {
    let html = pageHead("Guests & Carpool", "Who's coming, and who's driving with whom.",
      '<button class="btn" data-action="add-person">'+I.plus+' Add person</button>');
    if (!trip.people.length) return html + emptyState(I.guests, "No one added yet. Add the crew.", "add-person", "Add person");
    html += '<div class="card"><div class="list card-pad" style="padding-top:4px;padding-bottom:4px">';
    trip.people.forEach(p => {
      const g = trip.guests.find(x => x.personId === p.id) || { personId: p.id, departure:"", carpool:"", driver:false, seats:"", meetPoint:"" };
      const bits = [];
      if (g.departure) bits.push('Departs '+esc(g.departure));
      if (g.meetPoint) bits.push('From '+esc(g.meetPoint));
      if (g.carpool) bits.push('Carpool: '+esc(g.carpool));
      if (g.driver && Number(g.seats) > 0) bits.push(esc(g.seats)+' spare seat'+(Number(g.seats)===1?'':'s'));
      html += '<div class="row-item">' + avatarOf(p) +
        '<div class="row-main"><div class="row-title">'+esc(p.name)+(g.driver?' <span class="pill info" style="margin-left:6px">Driver</span>':"")+'</div>' +
        '<div class="row-sub">' + (bits.length?bits.join(' · '):'No details yet') + '</div></div>' +
        '<div class="row-actions"><button class="icon-btn" data-action="edit-guest" data-id="'+p.id+'" title="Edit">'+I.edit+'</button></div>' + '</div>';
    });
    html += '</div></div>';
    // carpool groupings
    const groups = {};
    trip.people.forEach(p => { const g = trip.guests.find(x=>x.personId===p.id); const key = (g&&g.carpool)?g.carpool:null; if (key) (groups[key]=groups[key]||[]).push({p,g}); });
    if (Object.keys(groups).length) {
      html += '<div class="day-head"><h4>Carpool groups</h4></div><div class="grid cols-2">';
      Object.keys(groups).forEach(k => {
        const members = groups[k];
        const drivers = members.filter(m=>m.g&&m.g.driver);
        const spareSeats = drivers.reduce((s,m)=>s+(Number(m.g.seats)||0),0);
        const capacity = spareSeats + drivers.length; // drivers' own seats + the spares they offer
        const occupied = members.length; // everyone currently in this group
        const riders = members.filter(m=>!(m.g&&m.g.driver)).length;
        const meet = (members.find(m=>m.g&&m.g.meetPoint)||{}).g;
        let cap = "";
        if (drivers.length) {
          const over = occupied > capacity;
          cap = '<span class="pill '+(over?"danger":"green")+'" style="margin-left:auto">'+occupied+' / '+capacity+' seat'+(capacity===1?"":"s")+(over?" · over!":"")+'</span>';
        } else if (riders) {
          cap = '<span class="pill warn" style="margin-left:auto">no driver yet</span>';
        }
        html += '<div class="card card-pad"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="label">'+esc(k)+'</span>'+cap+'</div>' +
          (meet&&meet.meetPoint?'<div class="row-sub" style="margin-bottom:8px">Meet: '+esc(meet.meetPoint)+(meet.departure?' · '+esc(meet.departure):"")+'</div>':"") +
          members.map(({p,g}) => '<div style="display:flex;align-items:center;gap:9px;padding:4px 0"><span class="avatar">'+initials(p.name)+'</span><span>'+esc(p.name)+'</span>'+((g&&g.driver)?'<span class="pill info" style="margin-left:auto">Driving'+(Number(g.seats)>0?' · '+esc(g.seats)+' seats':'')+'</span>':"")+'</div>').join("") +
          '</div>';
      });
      html += '</div>';
    }
    return html;
  }
  function guestFields() {
    return [
      { key:"driver", label:"Driver", type:"checkbox", checkLabel:"This person is driving" },
      { key:"seats", label:"Spare seats (if driving)", type:"number", placeholder:"e.g. 3", hint:"How many others they can take." },
      { key:"departure", label:"Departure time", type:"text", placeholder:"e.g. Fri 3 PM" },
      { key:"meetPoint", label:"Leaving from / meeting point", type:"text", placeholder:"e.g. Yonge & Eglinton" },
      { key:"carpool", label:"Carpool group", type:"datalist", options: (t) => Array.from(new Set((t.guests||[]).map(g=>g.carpool).filter(Boolean))), placeholder:"Pick an existing group or type a new one" },
    ];
  }

  /* ---------- Budget ---------- */
  function secBudget(trip) {
    const shopPurchases = (trip.shopping||[]).filter(s => s.gotIt && Number(s.price) > 0);
    const manualTotal = trip.budget.reduce((s,e)=>s+(Number(e.amount)||0),0);
    const shopTotal = shopPurchases.reduce((s,x)=>s+(Number(x.price)||0),0);
    const total = manualTotal + shopTotal;
    const itemCount = trip.budget.length + shopPurchases.length;
    let html = pageHead("Budget & Split", "Expenses and shopping purchases, split automatically.", addBtn("add-expense","Add expense"));
    if (!trip.people.length) html += noPeopleNote();
    const perHead = trip.people.length ? total/trip.people.length : 0;
    html += '<div class="grid cols-3 section-block">' +
      statTile("Total spent", '<span class="num">'+money(total)+'</span>', shopTotal>0?("incl. "+money(shopTotal)+" from shopping"):(itemCount+" item"+(itemCount===1?"":"s"))) +
      statTile("Per person", '<span class="num">'+money(perHead)+'</span>', "even split across the group") +
      statTile("Purchases", '<span class="num">'+itemCount+'</span>', "expenses + bought items") +
    '</div>';

    // settle up (includes shopping)
    const settle = computeSettle(trip);
    html += '<div class="section-block"><div class="section-title"><h3>Settle up</h3><span class="label">'+(settle.length ? settle.length+" payment"+(settle.length===1?"":"s") : "Fewest transfers")+'</span></div><div class="card card-pad">';
    if (!itemCount) html += '<p style="color:var(--muted);margin:0">Add an expense, or price a bought shopping item, to see who owes whom.</p>';
    else if (!settle.length) html += '<p style="color:var(--accent-ink);margin:0">All square — everyone\'s even.</p>';
    else html += '<p class="row-sub" style="margin:0 0 12px">Balances are netted to the fewest possible transfers — nobody both pays and gets paid.</p>' + settle.map(s => '<div class="settle">'+avatarById(trip, s.fromId)+'<span>'+esc(s.fromName)+'</span>' +
      '<span class="arrow">→ pays →</span>'+avatarById(trip, s.toId)+'<span>'+esc(s.toName)+'</span>' +
      '<span class="amt">'+money(s.amount)+'</span></div>').join("");
    html += '</div></div>';

    // manual expenses
    html += '<div class="section-title"><h3>Expenses</h3></div>';
    if (!trip.budget.length) html += '<div class="card card-pad" style="color:var(--muted)">No manual expenses yet. Shopping purchases you price up (below) still count toward the split.</div>';
    else {
      html += '<div class="card"><div class="list card-pad" style="padding-top:4px;padding-bottom:4px">';
      trip.budget.forEach(e => {
        const among = (e.splitAmong && e.splitAmong.length) ? e.splitAmong : trip.people.map(p=>p.id);
        html += '<div class="row-item"><div class="row-main"><div class="row-title">'+esc(e.description||"Expense")+'</div>' +
          '<div class="row-sub">Paid by '+esc(personName(trip,e.paidBy)||"?")+' · split '+among.length+' way'+(among.length===1?"":"s")+(e.date?' · '+esc(fmtDate(e.date,"md")):"")+'</div></div>' +
          receiptThumb(trip, e.receiptId) +
          '<span class="pill muted num" style="font-family:var(--font-mono)">'+money(e.amount)+'</span>' +
          rowActions("edit-expense","del-expense",e.id) + '</div>';
      });
      html += '</div></div>';
    }

    // shopping purchases (priced in the Shopping tab; shown here so the split is transparent)
    if (shopPurchases.length) {
      html += '<div class="day-head"><h4>From shopping</h4><button class="btn sm" data-action="nav" data-section="shopping">Open Shopping</button></div>';
      html += '<div class="card"><div class="list card-pad" style="padding-top:4px;padding-bottom:4px">';
      shopPurchases.forEach(s => {
        const among = (s.splitAmong && s.splitAmong.length) ? s.splitAmong : trip.people.map(p=>p.id);
        html += '<div class="row-item"><div class="row-main"><div class="row-title">'+esc(s.item)+'</div>' +
          '<div class="row-sub">Paid by '+esc(personName(trip,s.paidBy)||"?")+' · split '+among.length+' way'+(among.length===1?"":"s")+'</div></div>' +
          receiptThumb(trip, s.receiptId) +
          '<button class="pill green" data-action="shop-price" data-id="'+s.id+'" title="Edit price">'+money(s.price)+'</button></div>';
      });
      html += '</div></div>';
    }

    // receipts — one photo can cover many purchases
    const receipts = trip.receipts || [];
    html += '<div class="section-title"><h3>Receipts</h3>'+addBtn("add-receipt","Add receipt")+'</div>';
    if (!receipts.length) {
      html += '<div class="card card-pad" style="color:var(--muted)">No receipts yet. Add one photo, then tick which purchases it covers — handy when a single receipt paid for several items.</div>';
    } else {
      html += '<div class="grid cols-2">';
      receipts.forEach(r => {
        const items = receiptItems(trip, r.id);
        const n = items.length;
        html += '<div class="card card-pad">' +
          '<div style="display:flex;gap:12px;align-items:flex-start">' +
            (r.photo ? '<button class="receipt-thumb lg" data-action="view-receipt-id" data-id="'+r.id+'" title="View receipt"><img src="'+esc(r.photo)+'" alt="Receipt"></button>'
                     : '<span class="receipt-thumb lg empty">No<br>photo</span>') +
            '<div style="flex:1;min-width:0"><div class="row-title">'+esc(r.store||"Receipt")+'</div>' +
              '<div class="row-sub">covers '+n+' item'+(n===1?"":"s")+'</div></div>' +
          '</div>' +
          (n ? '<div class="receipt-items">'+items.map(it=>'<div class="ri-row"><span>'+esc(it.name)+'</span><span class="num">'+money(it.amount)+'</span></div>').join("")+'</div>' : "") +
          '<div style="display:flex;gap:8px;margin-top:12px">' +
            '<button class="btn sm primary" data-action="link-receipt" data-id="'+r.id+'">Choose items</button>' +
            '<button class="btn sm" data-action="edit-receipt" data-id="'+r.id+'">Edit</button>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    }
    return html;
  }
  function receiptThumb(trip, rid) {
    if (!rid) return "";
    const r = findById(trip.receipts||[], rid);
    if (!r || !r.photo) return "";
    return '<button class="receipt-thumb" data-action="view-receipt-id" data-id="'+r.id+'" title="View receipt"><img src="'+esc(r.photo)+'" alt="Receipt"></button>';
  }
  function expenseFields(trip) {
    return [
      { key:"description", label:"What was it?", type:"text", required:true, placeholder:"e.g. Groceries" },
      { key:"amount", label:"Amount ($)", type:"number", required:true, placeholder:"0.00", row:true },
      { key:"paidBy", label:"Paid by", type:"person" },
      { key:"date", label:"Date", type:"date" },
      { key:"splitAmong", label:"Split among", type:"multiperson", hint:"Everyone selected splits this evenly." },
    ];
  }
  function shoppingSpent(trip) {
    return (trip.shopping||[]).reduce((sum, x) => sum + ((x.gotIt && Number(x.price) > 0) ? Number(x.price) : 0), 0);
  }
  function gatherExpenses(trip) {
    // Unified money: manual expenses + priced, bought shopping items (both need a payer to be split).
    const list = [];
    (trip.budget||[]).forEach(e => { if (e.paidBy) list.push({ amount: Number(e.amount)||0, paidBy: e.paidBy, splitAmong: e.splitAmong }); });
    (trip.shopping||[]).forEach(s => { if (s.gotIt && Number(s.price) > 0 && s.paidBy) list.push({ amount: Number(s.price)||0, paidBy: s.paidBy, splitAmong: s.splitAmong }); });
    return list;
  }
  function computeSettle(trip) {
    const bal = {}; trip.people.forEach(p => bal[p.id] = 0);
    gatherExpenses(trip).forEach(e => {
      const amt = Number(e.amount)||0; if (!amt) return;
      const among = (e.splitAmong && e.splitAmong.length) ? e.splitAmong.filter(id=>bal[id]!=null) : trip.people.map(p=>p.id);
      if (!among.length) return;
      const share = amt / among.length;
      if (bal[e.paidBy] != null) bal[e.paidBy] += amt;
      among.forEach(id => { bal[id] -= share; });
    });
    const debtors = [], creditors = [];
    Object.keys(bal).forEach(id => { const v = Math.round(bal[id]*100)/100; if (v < -0.01) debtors.push({id, amt:-v}); else if (v > 0.01) creditors.push({id, amt:v}); });
    debtors.sort((a,b)=>b.amt-a.amt); creditors.sort((a,b)=>b.amt-a.amt);
    const out = []; let i=0, j=0;
    while (i < debtors.length && j < creditors.length) {
      const pay = Math.min(debtors[i].amt, creditors[j].amt);
      out.push({ fromId: debtors[i].id, toId: creditors[j].id, fromName: personName(trip,debtors[i].id), toName: personName(trip,creditors[j].id), amount: pay });
      debtors[i].amt -= pay; creditors[j].amt -= pay;
      if (debtors[i].amt < 0.01) i++; if (creditors[j].amt < 0.01) j++;
    }
    return out;
  }

  /* ---------- Receipts ---------- */
  function receiptFields() {
    return [
      { key:"photo", label:"Receipt photo", type:"receipt", hint:"Snap or upload the receipt." },
      { key:"store", label:"Store / label (optional)", type:"text", placeholder:"e.g. Costco, Aug 20" },
    ];
  }
  // Every purchase (expense or bought shopping item) linked to this receipt id.
  function receiptItems(trip, rid) {
    const out = [];
    (trip.budget||[]).forEach(e => { if (e.receiptId === rid) out.push({ kind:"budget", id:e.id, name:e.description||"Expense", amount:Number(e.amount)||0 }); });
    (trip.shopping||[]).forEach(s => { if (s.receiptId === rid) out.push({ kind:"shop", id:s.id, name:s.item, amount:Number(s.price)||0 }); });
    return out;
  }
  // Modal: tick which purchases this one receipt paid for.
  function openReceiptLinker(receipt) {
    const t = activeTrip();
    const rows = [];
    (t.budget||[]).forEach(e => rows.push({ kind:"budget", id:e.id, name:e.description||"Expense", sub:"Expense", amount:Number(e.amount)||0 }));
    (t.shopping||[]).forEach(s => { if (s.gotIt) rows.push({ kind:"shop", id:s.id, name:s.item, sub:"Shopping", amount:Number(s.price)||0 }); });
    const objOf = it => (it.kind==="budget" ? findById(t.budget, it.id) : findById(t.shopping, it.id));
    const overlay = document.getElementById("overlay");
    const body = rows.length ? rows.map(it => {
      const o = objOf(it);
      const on = o && o.receiptId === receipt.id;
      const other = o && o.receiptId && o.receiptId !== receipt.id;
      return '<label class="link-row">' +
        '<input type="checkbox" class="check" data-kind="'+it.kind+'" data-id="'+it.id+'"'+(on?" checked":"")+'>' +
        '<span class="link-main"><span class="link-name">'+esc(it.name)+'</span>' +
        '<span class="link-sub">'+esc(it.sub)+(it.amount?' · '+money(it.amount):"")+(other?' · on another receipt':"")+'</span></span>' +
        '</label>';
    }).join("") : '<p style="color:var(--muted);margin:0">No purchases to link yet. Mark shopping items as bought, or add expenses first.</p>';
    overlay.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal-head"><h3>Items on this receipt</h3><button class="icon-btn" data-close>'+I.x+'</button></div>' +
        '<div class="modal-body"><p class="hint" style="margin:0 0 12px">Tick everything this one receipt paid for.</p><div class="link-list">'+body+'</div></div>' +
        '<div class="modal-foot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="linkSave">Save</button></div>' +
      '</div>';
    overlay.classList.add("open");
    const saveBtn = document.getElementById("linkSave");
    if (saveBtn) saveBtn.addEventListener("click", () => {
      overlay.querySelectorAll('.link-row input[type="checkbox"]').forEach(cb => {
        const arr = cb.dataset.kind==="budget" ? t.budget : t.shopping;
        const o = findById(arr, cb.dataset.id);
        if (!o) return;
        if (cb.checked) o.receiptId = receipt.id;
        else if (o.receiptId === receipt.id) o.receiptId = "";
      });
      closeModal(); save(); render(); toast("Receipt updated");
    });
  }

  function editWeather(date) {

      fields: [
        { key:"high", label:"High (°C)", type:"number", placeholder:"e.g. 24", row:true },

        { key:"precip", label:"Precipitation", type:"text", placeholder:"e.g. 20% / 5mm", row:true },
        { key:"notes", label:"Notes", type:"text", placeholder:"Optional" },
      ], values: w,
      onSubmit: v => { Object.assign(w, v); if (isNew) t.weather.push(w); save(); logActivity("updated the forecast for "+fmtDate(date,"md")); render(); toast("Forecast saved"); } };
    if (!isNew) { // this day has a manual override — offer a jump back to the live forecast

  /* ---------- Full-day hourly forecast ---------- */
  let hourlyWxCache = null, hourlyWxKey = "";
  async function loadHourlyWx(force) {
    const t = activeTrip();
    let lat = parseFloat(t.lat), lon = parseFloat(t.lon);
    if (!(lat && lon)) { const g = await geocode(t.location); if (g) { lat = g.lat; lon = g.lon; } }
    if (!(lat && lon)) return null;
    const key = lat.toFixed(3) + "," + lon.toFixed(3);
    if (hourlyWxCache && hourlyWxKey === key && !force) return hourlyWxCache;
    try {
      const r = await fetch("https://api.open-meteo.com/v1/forecast?hourly=temperature_2m,precipitation_probability,weather_code&timezone=auto&forecast_days=16&latitude=" + lat + "&longitude=" + lon);
      const j = await r.json();
      if (j.hourly && j.hourly.time && j.hourly.time.length) { hourlyWxCache = j.hourly; hourlyWxKey = key; return hourlyWxCache; }
    } catch (e) {}
    return null;
  }
  function hoursForDate(hourly, date) {
    const out = [];
    (hourly.time || []).forEach((iso, i) => {
      if (iso.slice(0, 10) !== date) return;
      const h = parseInt(iso.slice(11, 13), 10);
      if (h < 6 || h > 23) return; // waking hours, 6am–11pm
      out.push({
        h: h,
        temp: hourly.temperature_2m ? hourly.temperature_2m[i] : null,
        pp: hourly.precipitation_probability ? (hourly.precipitation_probability[i] || 0) : 0,
        code: hourly.weather_code ? hourly.weather_code[i] : null
      });
    });
    return out;
  }
  function fmtHourShort(h) { let hh = h % 12; if (hh === 0) hh = 12; return hh + (h < 12 ? "a" : "p"); }
  function fmtHourLong(h) { let hh = h % 12; if (hh === 0) hh = 12; return hh + " " + (h < 12 ? "AM" : "PM"); }
  function hourlyChart(hours) {
    if (!hours.length) return "";
    const W = 640, H = 236, padL = 26, padR = 16, N = hours.length;
    const step = (W - padL - padR) / Math.max(1, N - 1);
    const x = i => padL + i * step;
    const temps = hours.map(h => h.temp).filter(v => v != null);
    if (!temps.length) return "";
    let tmin = Math.min.apply(null, temps), tmax = Math.max.apply(null, temps);
    if (tmin === tmax) { tmin -= 1; tmax += 1; }
    const tTop = 26, tBot = 116;
    const ty = v => tBot - (v - tmin) / (tmax - tmin) * (tBot - tTop);
    const pBase = 200, pTop = 138;
    const barW = Math.min(20, step * 0.55);
    let bars = "";
    hours.forEach((h, i) => {
      const pp = h.pp || 0;
      const bh = pp / 100 * (pBase - pTop);
      if (bh > 0.5) bars += '<rect x="' + (x(i) - barW / 2).toFixed(1) + '" y="' + (pBase - bh).toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="2" fill="#4E93D6" opacity="' + (0.4 + pp / 100 * 0.5).toFixed(2) + '"></rect>';
      if (pp >= 20) bars += '<text x="' + x(i).toFixed(1) + '" y="' + (pBase - bh - 3).toFixed(1) + '" text-anchor="middle" class="dc-pp">' + pp + '</text>';
    });
    const pts = hours.filter(h => h.temp != null).map((h, i) => x(hours.indexOf(h)).toFixed(1) + ',' + ty(h.temp).toFixed(1)).join(" ");
    let dots = "";
    hours.forEach((h, i) => { if (h.temp != null) dots += '<circle cx="' + x(i).toFixed(1) + '" cy="' + ty(h.temp).toFixed(1) + '" r="2.2" fill="#E8863B"></circle>'; });
    let iMax = 0, iMin = 0;
    hours.forEach((h, i) => { if (h.temp != null) { if (h.temp > hours[iMax].temp) iMax = i; if (h.temp < hours[iMin].temp) iMin = i; } });
    let tlabels = "";
    [iMax, iMin].forEach(i => { if (hours[i].temp != null) tlabels += '<text x="' + x(i).toFixed(1) + '" y="' + (ty(hours[i].temp) - 7).toFixed(1) + '" text-anchor="middle" class="dc-t">' + Math.round(hours[i].temp) + '°</text>'; });
    let xlabels = "";
    hours.forEach((h, i) => { if (h.h % 3 === 0 || i === N - 1) xlabels += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" class="dc-x">' + fmtHourShort(h.h) + '</text>'; });
    const axis = '<line x1="' + padL + '" y1="' + pBase + '" x2="' + (W - padR) + '" y2="' + pBase + '" class="dc-axis"></line>';
    return '<svg class="day-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      axis + bars +
      '<polyline points="' + pts + '" fill="none" stroke="#E8863B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>' +
      dots + tlabels + xlabels + '</svg>';
  }
  function hourlyListHtml(hours, riseH, setH) {
    return '<div class="hr-list">' + hours.map(h => {
      const pp = h.pp || 0;
      let kind = h.code != null ? wmoInfo(h.code).icon : null;
      if (kind === "sun" && (h.h < riseH || h.h >= setH)) kind = "moon"; // clear night -> moon
      return '<div class="hr-row">' +
        '<span class="hr-time">' + fmtHourLong(h.h) + '</span>' +
        '<span class="hr-ic">' + (kind ? wxIcon(kind, 24) : '') + '</span>' +
        '<span class="hr-temp">' + (h.temp != null ? Math.round(h.temp) + '°' : '—') + '</span>' +
        '<span class="hr-precip"><span class="hr-bar"><span style="width:' + pp + '%"></span></span><span class="hr-pp">' + pp + '%</span></span>' +
        '</div>';
    }).join("") + '</div>';
  }
  async function openDayForecast(date) {
    const t = activeTrip();
    const overlay = document.getElementById("overlay");
    overlay.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><h3>' + esc(fmtDate(date, "dow")) + ' · ' + esc(fmtDate(date, "md")) + '</h3>' +
        '<div style="display:flex;gap:8px;align-items:center">' +
          '<button class="btn sm ghost" id="dayEditBtn">' + I.edit + ' Edit</button>' +
          '<button class="icon-btn" data-close>' + I.x + '</button></div></div>' +
      '<div class="modal-body" id="dayFcBody"><div class="day-loading">Loading hourly forecast…</div></div>' +
      '</div>';
    overlay.classList.add("open");
    const editBtn = document.getElementById("dayEditBtn");
    if (editBtn) editBtn.addEventListener("click", () => editWeather(date));
    const manual = (t.weather || []).find(x => x.date === date && (x.high || x.low || x.condition));
    const hourly = await loadHourlyWx();
    const body = document.getElementById("dayFcBody");
    if (!body) return; // modal was closed while loading
    const hours = hourly ? hoursForDate(hourly, date) : [];
    let html = "";
    if (manual) {
      html += '<div class="day-summary manual"><span class="label" style="color:var(--info)">Your forecast</span>' +
        '<div class="ds-temps">' + (manual.high ? esc(manual.high) + '°' : '') + (manual.low ? ' / ' + esc(manual.low) + '°' : '') + '</div>' +
        (manual.condition ? '<div class="ds-cond">' + esc(manual.condition) + '</div>' : '') +
        (manual.precip ? '<div class="row-sub">Precip: ' + esc(manual.precip) + '</div>' : '') +
        (manual.notes ? '<div class="row-sub">' + esc(manual.notes) + '</div>' : '') + '</div>';
    }
    if (hours.length && hours.some(h => h.temp != null)) {
      const temps = hours.map(h => h.temp).filter(v => v != null);
      const hi = Math.round(Math.max.apply(null, temps)), lo = Math.round(Math.min.apply(null, temps));
      const maxPp = Math.max.apply(null, hours.map(h => h.pp || 0));
      html += '<div class="day-summary">' +
        '<div class="ds-temps"><span class="ds-hi">' + hi + '°</span><span class="ds-lo"> / ' + lo + '°</span></div>' +
        '<div class="ds-cond">High &amp; low · ' + maxPp + '% peak chance of precip</div></div>';
      html += '<div class="day-legend"><span class="lg-temp">— Temperature</span><span class="lg-precip">▮ Chance of precip</span></div>';
      html += hourlyChart(hours);
      const sd = sunData && sunData[date];
      const riseH = sd && sd.rise ? Math.floor(sunMin(sd.rise) / 60) : 6;
      const setH = sd && sd.set ? Math.ceil(sunMin(sd.set) / 60) : 20;
      html += '<div class="hr-head"><span>Hour</span><span></span><span>Temp</span><span>Precip</span></div>';
      html += hourlyListHtml(hours, riseH, setH);
    } else {
      html += '<div class="day-loading">' + (manual ? "The live hourly forecast isn’t out for this day yet — only your own note above." : "The hourly forecast isn’t available for this day yet. It fills in automatically within about 16 days of the trip. You can tap Edit to jot your own forecast.") + '</div>';
    }
    body.innerHTML = html;
  }

  function openShopPrice(s) {

    openForm({ title: "Price — " + (s.item || "item"), submitLabel: "Save",

        { key:"paidBy", label:"Who paid", type:"person" },

      ],

      onSubmit: v => {

      }
